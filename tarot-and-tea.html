<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tarot &amp; Tea — Mystic Readings | Timeflo Experiences</title>
<meta name="description" content="Draw from 78 cards and receive witty, sarcastic cosmic readings from The Oracle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
:root{
  --ink:#0d0b14;--surface:#14101f;--surface2:#1c1630;--surface3:#241e3d;
  --gold:#c9a84c;--gold-light:#e8c96a;--purple:#7c5cbf;--purple-light:#9b7dd4;
  --rose:#c2556e;--teal:#3a9e8c;--text:#e8e2f5;--text-muted:#9a90b8;
  --border:rgba(201,168,76,0.18);--border-s:rgba(201,168,76,0.38);
}
html,body{height:100dvh;width:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;user-select:none;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 20% 10%,rgba(124,92,191,.15) 0%,transparent 55%),
             radial-gradient(ellipse at 80% 90%,rgba(194,85,110,.10) 0%,transparent 55%),
             linear-gradient(160deg,#0d0b14 0%,#14101f 50%,#0d0b14 100%);}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(1px 1px at 15% 20%,rgba(201,168,76,.5) 0%,transparent 100%),
                   radial-gradient(1px 1px at 35% 8%,rgba(255,255,255,.3) 0%,transparent 100%),
                   radial-gradient(1.5px 1.5px at 72% 15%,rgba(201,168,76,.4) 0%,transparent 100%),
                   radial-gradient(1px 1px at 88% 30%,rgba(255,255,255,.25) 0%,transparent 100%),
                   radial-gradient(1px 1px at 55% 5%,rgba(201,168,76,.35) 0%,transparent 100%),
                   radial-gradient(1.5px 1.5px at 10% 65%,rgba(255,255,255,.2) 0%,transparent 100%),
                   radial-gradient(1px 1px at 92% 70%,rgba(201,168,76,.3) 0%,transparent 100%),
                   radial-gradient(1px 1px at 45% 85%,rgba(255,255,255,.2) 0%,transparent 100%),
                   radial-gradient(1.5px 1.5px at 25% 92%,rgba(201,168,76,.4) 0%,transparent 100%);}
.glass{background:rgba(28,22,48,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);}
.glass-s{background:rgba(36,30,61,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border-s);}
.fd{font-family:'Cinzel',serif;}
.sc{scrollbar-width:thin;scrollbar-color:rgba(124,92,191,.4) transparent;}
.sc::-webkit-scrollbar{width:4px;}.sc::-webkit-scrollbar-thumb{background:rgba(124,92,191,.4);border-radius:99px;}
.btn-g{background:linear-gradient(135deg,#c9a84c,#e8c96a,#c9a84c);color:var(--ink);font-family:'Cinzel',serif;font-weight:700;border:1px solid rgba(201,168,76,.6);box-shadow:0 2px 16px rgba(201,168,76,.25);transition:all .2s;cursor:pointer;}
.btn-g:active{transform:translateY(1px);}
.btn-gh{background:rgba(124,92,191,.12);color:var(--text);border:1px solid rgba(124,92,191,.3);transition:all .2s;cursor:pointer;}
.btn-gh:hover{border-color:rgba(124,92,191,.55);background:rgba(124,92,191,.18);}
.timeflo-back{position:relative;z-index:30;flex-shrink:0;padding:5px 14px;background:rgba(124,92,191,.1);border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--purple-light);}
.timeflo-back a{text-decoration:none;color:inherit;}.timeflo-back a:hover{text-decoration:underline;}
.perspective{perspective:1200px;}
.c3d{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.22,1,.36,1);transform-style:preserve-3d;}
.c3d.flipped{transform:rotateY(180deg);}
.cface{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden;}
.cface-f{transform:rotateY(180deg);}
.rev-art{transform:rotate(180deg);}
.fan-c{transition:all .25s cubic-bezier(.2,.9,.3,1.25);cursor:pointer;}
.fan-c:hover{transform:translateY(-18px) scale(1.1) !important;z-index:30 !important;filter:drop-shadow(0 8px 20px rgba(201,168,76,.4));}
.fan-c.picked{opacity:0;pointer-events:none;transform:translateY(-50px) scale(.7) !important;}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg) translateX(-6px)}75%{transform:rotate(5deg) translateX(6px)}}
.shuf{animation:wiggle .3s ease-in-out infinite;}
@keyframes pglow{0%,100%{box-shadow:0 0 10px rgba(201,168,76,.2)}50%{box-shadow:0 0 22px rgba(201,168,76,.45)}}
.aglow{animation:pglow 3s ease-in-out infinite;}
@keyframes forb{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.forb{animation:forb 4s ease-in-out infinite;}
#app{position:relative;z-index:10;display:flex;flex-direction:column;height:100dvh;width:100%;}
header{flex-shrink:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);background:rgba(13,11,20,.85);backdrop-filter:blur(16px);}
main{flex:1;min-height:0;display:flex;flex-direction:column;max-width:720px;width:100%;margin:0 auto;padding:12px 14px;overflow:hidden;}
section{display:none;flex:1;min-height:0;flex-direction:column;}
section.active{display:flex;overflow-y:auto;}
.cat-p{border-radius:10px;padding:10px 12px;background:rgba(28,22,48,.6);border:1px solid var(--border);text-align:left;display:flex;align-items:center;gap:10px;transition:all .2s;cursor:pointer;}
.cat-p:hover,.cat-p.active{background:rgba(124,92,191,.15);border-color:rgba(124,92,191,.5);}
.cat-p.active{border-color:var(--gold);background:rgba(201,168,76,.08);}
input[type=text],select{background:rgba(28,22,48,.7);border:1px solid var(--border-s);color:var(--text);font-family:'Inter',sans-serif;border-radius:10px;outline:none;transition:border-color .2s;}
input[type=text]::placeholder{color:var(--text-muted);}
input[type=text]:focus{border-color:rgba(201,168,76,.5);}
select option{background:var(--surface2);color:var(--text);}
.tab-p{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text-muted);background:transparent;border:1px solid transparent;cursor:pointer;transition:all .2s;white-space:nowrap;}
.tab-p.active{color:var(--gold);background:rgba(201,168,76,.1);border-color:rgba(201,168,76,.3);}
.tab-p:hover:not(.active){color:var(--text);background:rgba(255,255,255,.04);}
.sp-opt{flex:1;text-align:center;padding:7px 10px;border-radius:8px;font-size:12px;font-family:'Cinzel',serif;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .2s;border:1px solid transparent;background:transparent;}
.sp-opt.active{background:rgba(201,168,76,.15);border-color:rgba(201,168,76,.4);color:var(--gold-light);}
.badge{display:inline-flex;align-items:center;justify-content:center;padding:1px 7px;border-radius:99px;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.35);color:var(--gold);font-size:10px;font-weight:700;}
.kw{padding:3px 10px;border-radius:99px;background:rgba(124,92,191,.15);border:1px solid rgba(124,92,191,.3);color:var(--purple-light);font-size:11px;font-weight:600;}
.obox{background:rgba(28,22,48,.7);border:1px solid rgba(201,168,76,.22);border-radius:12px;}
.modal{position:fixed;inset:0;background:rgba(13,11,20,.85);backdrop-filter:blur(8px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal.hidden{display:none;}
.mbox{background:var(--surface2);border:1px solid var(--border-s);border-radius:18px;box-shadow:0 24px 64px rgba(0,0,0,.7);max-width:720px;width:100%;max-height:86dvh;display:flex;flex-direction:column;overflow:hidden;}
.slot-p{padding:5px 12px;border-radius:8px;border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-muted);}
.slot-p.filled{border-color:rgba(201,168,76,.4);color:var(--gold);background:rgba(201,168,76,.08);}
@media(max-width:480px){main{padding:10px 12px;}header{padding:0 12px;}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button onclick="resetToSetup()" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:4px 0;">
      <div class="forb" style="width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e8c96a,#c9a84c,#7c5cbf);border:1px solid rgba(201,168,76,.5);flex-shrink:0;"></div>
      <div>
        <span class="fd" style="font-size:16px;font-weight:700;color:var(--gold);letter-spacing:.04em;display:block;line-height:1.1;">Tarot &amp; Tea</span>
        <span style="font-size:10px;color:var(--text-muted);font-weight:500;letter-spacing:.06em;text-transform:uppercase;">Cosmic Readings</span>
      </div>
    </button>
    <div style="display:flex;align-items:center;gap:8px;">
      <button onclick="openGrimoireModal()" class="btn-gh" style="padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;">
        <i class="ph-fill ph-cards" style="color:var(--purple-light);font-size:14px;"></i><span>Deck</span>
      </button>
      <button onclick="openBurnBookModal()" class="btn-gh" style="padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;">
        <i class="ph-fill ph-notebook" style="color:var(--rose);font-size:14px;"></i><span>Journal</span>
        <span id="burnBadge" class="badge">0</span>
      </button>
      <button onclick="toggleAudio()" class="btn-gh" style="padding:6px;border-radius:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;">
        <i id="audioIcon" class="ph-fill ph-speaker-high" style="font-size:15px;"></i>
      </button>
    </div>
  </header>
  <nav class="timeflo-back"><a href="experiences.html">&#8592; Timeflo Experiences</a></nav>
  <main>
    <!-- STAGE 1: SETUP -->
    <section id="stage-setup" class="active" style="gap:12px;">
      <div style="text-align:center;flex-shrink:0;padding:2px 0 6px;">
        <div class="aglow forb" style="width:50px;height:50px;border-radius:50%;margin:0 auto 8px;background:radial-gradient(circle at 35% 35%,#e8c96a,#9b7dd4,#c2556e);border:2px solid rgba(201,168,76,.45);"></div>
        <h1 class="fd" style="font-size:clamp(14px,4vw,18px);color:var(--gold);letter-spacing:.06em;font-weight:700;">The Oracle Awaits</h1>
        <p style="font-size:12px;color:var(--text-muted);margin-top:3px;font-style:italic;">"Ask something interesting. I've seen it all."</p>
      </div>
      <div style="flex-shrink:0;">
        <p style="font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;">What's the matter?</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <button type="button" onclick="selectCategory('love')" data-cat="love" class="cat-p active">
            <span style="font-size:18px;flex-shrink:0;">&#128152;</span>
            <div><div class="fd" style="font-size:11px;font-weight:600;color:var(--text);">Love &amp; Exes</div><div style="font-size:10px;color:var(--text-muted);">Crushes &amp; red flags</div></div>
          </button>
          <button type="button" onclick="selectCategory('career')" data-cat="career" class="cat-p">
            <span style="font-size:18px;flex-shrink:0;">&#128184;</span>
            <div><div class="fd" style="font-size:11px;font-weight:600;color:var(--text);">Career &amp; Cash</div><div style="font-size:10px;color:var(--text-muted);">Jobs &amp; the bag</div></div>
          </button>
          <button type="button" onclick="selectCategory('growth')" data-cat="growth" class="cat-p">
            <span style="font-size:18px;flex-shrink:0;">&#129504;</span>
            <div><div class="fd" style="font-size:11px;font-weight:600;color:var(--text);">Mind &amp; Soul</div><div style="font-size:10px;color:var(--text-muted);">Growth &amp; habits</div></div>
          </button>
          <button type="button" onclick="selectCategory('general')" data-cat="general" class="cat-p">
            <span style="font-size:18px;flex-shrink:0;">&#128302;</span>
            <div><div class="fd" style="font-size:11px;font-weight:600;color:var(--text);">General Vibes</div><div style="font-size:10px;color:var(--text-muted);">Surprise twists</div></div>
          </button>
        </div>
      </div>
      <div style="flex-shrink:0;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <label for="qInput" style="font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;">Your Question</label>
          <button type="button" onclick="rollQ()" class="btn-gh" style="padding:4px 12px;border-radius:99px;font-size:11px;font-weight:600;">&#127922; Random</button>
        </div>
        <input id="qInput" type="text" maxlength="140" placeholder="e.g., Are they actually busy, or just avoiding me?" style="width:100%;padding:11px 14px;font-size:14px;font-weight:500;">
      </div>
      <div class="glass" style="border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;">
        <div style="display:flex;background:rgba(13,11,20,.6);border-radius:10px;padding:3px;border:1px solid var(--border);flex:1;gap:3px;">
          <button type="button" onclick="selectSpread(1)" id="sp1" class="sp-opt">&#9889; 1 Card</button>
          <button type="button" onclick="selectSpread(3)" id="sp3" class="sp-opt active">&#10022; 3 Cards</button>
        </div>
        <button type="button" onclick="startShuffle()" class="btn-g" style="padding:11px 20px;border-radius:10px;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:6px;">
          Draw Fate <i class="ph-fill ph-sparkle" style="font-size:15px;"></i>
        </button>
      </div>
    </section>
    <!-- STAGE 2: DRAW -->
    <section id="stage-draw" style="gap:12px;">
      <div class="glass" style="border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;flex-shrink:0;">
        <div class="aglow" style="width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e8c96a,#9b7dd4);border:1px solid rgba(201,168,76,.45);flex-shrink:0;"></div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;">
            <span class="fd" style="font-size:13px;color:var(--gold);font-weight:600;">The Oracle</span>
            <span class="badge">Pick <strong id="remCount">3</strong></span>
          </div>
          <p id="quip" style="font-size:12px;color:var(--text);font-weight:500;line-height:1.4;font-style:italic;"></p>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;">
        <p style="font-size:10px;color:var(--text-muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;">Tap a card to draw</p>
        <div id="fanRow" style="display:flex;align-items:center;justify-content:center;flex-wrap:wrap;max-width:100%;padding:8px;"></div>
      </div>
      <div class="glass" style="border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;">
        <div id="slotsPrev" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;"></div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button onclick="reshuffleFan()" class="btn-gh" style="padding:7px 12px;border-radius:8px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;"><i class="ph-bold ph-shuffle"></i> Shuffle</button>
          <button onclick="autoDraw()" class="btn-g" style="padding:7px 12px;border-radius:8px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;"><i class="ph-fill ph-lightning"></i> Auto</button>
          <button onclick="resetToSetup()" style="padding:7px;border-radius:8px;font-size:11px;font-weight:600;color:var(--text-muted);background:none;border:none;cursor:pointer;">Back</button>
        </div>
      </div>
    </section>
    <!-- STAGE 3: READING -->
    <section id="stage-reading" style="gap:10px;">
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <div id="readTabs" style="display:flex;align-items:center;gap:2px;background:rgba(13,11,20,.6);padding:3px;border-radius:10px;border:1px solid var(--border);overflow-x:auto;max-width:100%;flex:1;" class="sc"></div>
      </div>
      <div id="readPanel" class="glass-s" style="flex:1;min-height:0;border-radius:16px;padding:14px;display:flex;flex-direction:column;overflow:hidden;"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;">
        <button onclick="resetToSetup()" class="btn-gh" style="padding:9px 14px;border-radius:10px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;"><i class="ph-bold ph-arrows-counter-clockwise"></i> New Reading</button>
        <div style="display:flex;align-items:center;gap:8px;">
          <button id="flipAllBtn" onclick="flipAll()" class="btn-gh" style="padding:9px 14px;border-radius:10px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;"><i class="ph-bold ph-eye"></i> Reveal All</button>
          <button id="shareBtn" onclick="shareReading()" class="btn-g" style="padding:9px 14px;border-radius:10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;"><i class="ph-bold ph-share-network"></i> Share</button>
        </div>
      </div>
    </section>
  </main>
</div>
<!-- DECK MODAL -->
<div id="deckModal" class="modal hidden">
  <div class="mbox">
    <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
      <div><h3 class="fd" style="font-size:15px;font-weight:700;color:var(--gold);">The 78-Card Deck</h3><p style="font-size:11px;color:var(--text-muted);margin-top:2px;">Tap any card to explore its meaning</p></div>
      <button onclick="closeGrimoireModal()" class="btn-gh" style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;"><i class="ph-bold ph-x" style="font-size:13px;"></i></button>
    </div>
    <div style="padding:10px 18px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;flex-shrink:0;">
      <input type="text" id="deckSearch" oninput="renderDeckGrid()" placeholder="Search cards..." style="flex:1;min-width:140px;padding:7px 12px;font-size:12px;">
      <select id="deckSuit" onchange="renderDeckGrid()" style="padding:7px 12px;font-size:12px;font-weight:600;border-radius:10px;cursor:pointer;">
        <option value="ALL">All 78 Cards</option>
        <option value="Major Arcana">Major Arcana (22)</option>
        <option value="Wands">Wands &#128293;</option>
        <option value="Cups">Cups &#128167;</option>
        <option value="Swords">Swords &#9876;&#65039;</option>
        <option value="Pentacles">Pentacles &#129689;</option>
      </select>
    </div>
    <div id="deckBody" style="flex:1;overflow-y:auto;padding:14px 18px;" class="sc"></div>
  </div>
</div>
<!-- JOURNAL MODAL -->
<div id="journalModal" class="modal hidden">
  <div class="mbox" style="max-width:560px;">
    <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
      <div><h3 class="fd" style="font-size:15px;font-weight:700;color:var(--gold);">Reading Journal</h3><p style="font-size:11px;color:var(--text-muted);margin-top:2px;">Your past readings &amp; cosmic receipts</p></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button onclick="clearJournal()" style="padding:5px 10px;border-radius:7px;font-size:11px;font-weight:600;color:var(--rose);background:rgba(194,85,110,.1);border:1px solid rgba(194,85,110,.25);cursor:pointer;">Clear All</button>
        <button onclick="closeJournalModal()" class="btn-gh" style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;"><i class="ph-bold ph-x" style="font-size:13px;"></i></button>
      </div>
    </div>
    <div id="journalList" style="flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px;" class="sc"></div>
  </div>
</div>
<script>
const MAJOR_ARCANA = [
            {
                id: 1, number: 0, numeral: "0", name: "The Fool", arcana: "Major Arcana", suit: "Major", element: "Air",
                kwUp: ["YOLO Mode", "Fresh Start", "Zero Plan"], kwRev: ["Clown Behavior", "Tripping", "Overthinking"],
                up: {
                    love: "You're diving into a crush with zero parachute and 100% vibes. It's cute, just check if they have a mattress on a bedframe first.",
                    career: "Time to try something totally new even if you have no clue what you're doing. Fake it till you make it!",
                    growth: "New era unlocked! Pack light and leave your old cringe memories at the curb.",
                    general: "Main character leap of faith! You don't have a map, you're just vibing, and somehow the universe loves it."
                },
                rev: {
                    love: "Put the clown shoes down! You're either ignoring neon red flags or too scared to even say hi.",
                    career: "Maybe don't impulse-quit your job without checking your bank account first.",
                    growth: "You're either doing reckless stunts to avoid your feelings or stalling because you want a 'sign.' This is the sign.",
                    general: "Look where you're walking! You're about to trip over an obvious bad decision."
                }

// --- AUDIO SYSTEM (Web Audio API Synthesizer) ---
let audioEnabled = true;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSound(type) {
  if (!audioEnabled) return;
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    if (type === 'tap') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(480, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.05);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'flip') {
      const bufSize = audioCtx.sampleRate * 0.1;
      const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.3));
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(800, now);
      filter.Q.setValueAtTime(3, now);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);
    } else if (type === 'bell') {
      [880, 1320, 1760].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.04);
        gain.gain.setValueAtTime(0.07, now + idx * 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.04);
        osc.stop(now + 1.2);
      });
    }
  } catch (e) {
    // Audio context may require explicit user interaction
  }
}

function toggleAudio() {
  audioEnabled = !audioEnabled;
  const icon = document.getElementById('audioIcon');
  if (icon) {
    icon.className = audioEnabled ? 'ph-fill ph-speaker-high' : 'ph-fill ph-speaker-slash';
  }
  if (audioEnabled) playSound('tap');
}

            suit: d.card.suit,

const appState = {
  category: 'love',
  question: '',
  spread: 3, // 1 or 3
  fanCards: [],
  drawnCards: [], // [{ card, isReversed, positionTitle, flipped }]
  activeTabIndex: 0,
  aiReading: null,
  journal: []
};

// --- JOURNAL (Burn Book) STORAGE ---
const JOURNAL_STORAGE_KEY = 'timeflo_tarot_journal';

function loadJournal() {
  try {
    const raw = localStorage.getItem(JOURNAL_STORAGE_KEY);
    appState.journal = raw ? JSON.parse(raw) : [];
  } catch (e) {
    appState.journal = [];
  }
  updateJournalBadge();
}

function saveReadingToJournal() {
  if (!appState.drawnCards.length) return;
  const entry = {
    id: Date.now(),
    date: new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
    category: appState.category,
    question: appState.question || "Cosmic inquiry",
    spread: appState.spread,
    cards: appState.drawnCards.map(c => ({
      name: c.card.name,
      isReversed: c.isReversed,
      pos: c.positionTitle
    })),
    verdict: appState.aiReading?.cosmicVerdict || "Truth delivered without sugarcoating."
  };
  appState.journal.unshift(entry);
  if (appState.journal.length > 30) appState.journal.pop();
  try {
    localStorage.setItem(JOURNAL_STORAGE_KEY, JSON.stringify(appState.journal));
  } catch (e) {}
  updateJournalBadge();
}

function updateJournalBadge() {
  const badge = document.getElementById('burnBadge');
  if (badge) badge.innerText = appState.journal.length;
}

function clearJournal() {
  if (confirm("Clear all archived readings from your journal?")) {
    appState.journal = [];
    try { localStorage.removeItem(JOURNAL_STORAGE_KEY); } catch (e) {}
    updateJournalBadge();
    renderJournalList();
  }
}

function openBurnBookModal() {
  playSound('tap');
  renderJournalList();
  document.getElementById('journalModal')?.classList.remove('hidden');
}

function closeJournalModal() {
  playSound('tap');
  document.getElementById('journalModal')?.classList.add('hidden');
}

// --- GRIMOIRE / 78-CARD DECK MODAL ---
function openGrimoireModal() {
  playSound('tap');
  renderDeckGrid();
  document.getElementById('deckModal')?.classList.remove('hidden');
}

function closeGrimoireModal() {
  playSound('tap');
  document.getElementById('deckModal')?.classList.add('hidden');
}

function renderDeckGrid() {
  const container = document.getElementById('deckBody');
  const query = (document.getElementById('deckSearch')?.value || '').toLowerCase().trim();
  const suitFilter = document.getElementById('deckSuit')?.value || 'ALL';
  if (!container) return;

  const filtered = FULL_DECK.filter(card => {
    if (suitFilter === 'Major Arcana' && card.arcana !== 'Major Arcana') return false;
    if (suitFilter !== 'ALL' && suitFilter !== 'Major Arcana' && card.suit !== suitFilter) return false;
    if (!query) return true;
    return card.name.toLowerCase().includes(query) ||
           card.kwUp.some(k => k.toLowerCase().includes(query)) ||
           card.kwRev.some(k => k.toLowerCase().includes(query));
  });

  if (!filtered.length) {
    container.innerHTML = `<p style="text-align:center;padding:30px;color:var(--text-muted);font-size:12px;">No cards match your inquiry.</p>`;
    return;
  }

  container.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;">
      ${filtered.map(card => `
        <div onclick="showCardDetail(${card.id})" style="background:rgba(28,22,48,.6);border:1px solid var(--border);border-radius:12px;padding:10px;cursor:pointer;transition:transform .2s,border-color .2s;text-align:center;" class="fan-c">
          <div style="aspect-ratio:5/8;width:100%;border-radius:8px;overflow:hidden;margin-bottom:8px;box-shadow:0 4px 12px rgba(0,0,0,.4);">
            ${renderCardFrontSVG(card, false)}
          </div>
          <p class="fd" style="font-size:11px;font-weight:700;color:var(--gold);">${card.name}</p>
          <p style="font-size:10px;color:var(--text-muted);margin-top:2px;">${card.arcana === 'Major Arcana' ? 'Major Arcana' : card.suit}</p>
        </div>
      `).join('')}
    </div>
  `;
}

function showCardDetail(cardId) {
  const card = FULL_DECK.find(c => c.id === cardId);
  if (!card) return;
  playSound('tap');
  const suitKey = card.arcana === 'Major Arcana' ? 'Major' : card.suit;
  const tea = TEA_PAIRINGS[suitKey];

  alert(`${card.name.toUpperCase()} (${card.arcana})\n\n✦ Upright: ${card.up.general}\n✦ Reversed: ${card.rev.general}\n\n☕ Tea Pairing: ${tea.name}\n${tea.why}`);
}

function selectCategory(cat) {

  appState.category = cat;
  document.querySelectorAll('.cat-p').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-cat') === cat);

}

function rollQ() {
  playSound('tap');
  const list = SNARKY_QUESTIONS[appState.category] || SNARKY_QUESTIONS.general;
  const pick = list[Math.floor(Math.random() * list.length)];
  const input = document.getElementById('qInput');

function selectSpread(spreadNum) {
  playSound('tap');
  appState.spread = spreadNum;
  document.getElementById('sp1')?.classList.toggle('active', spreadNum === 1);
  document.getElementById('sp3')?.classList.toggle('active', spreadNum === 3);
}

// --- DRAW STAGE LOGIC ---
function startShuffle() {
  playSound('bell');
  const qVal = document.getElementById('qInput')?.value.trim();
  appState.question = qVal || "";
  appState.drawnCards = [];
  appState.aiReading = null;

  // Switch to stage-draw
  document.getElementById('stage-setup')?.classList.remove('active');
  document.getElementById('stage-reading')?.classList.remove('active');
  document.getElementById('stage-draw')?.classList.add('active');

  // Random snarky quip
  const quipEl = document.getElementById('quip');
  if (quipEl) {
    quipEl.innerText = ORACLE.shuffleQuips[Math.floor(Math.random() * ORACLE.shuffleQuips.length)];
  }

  reshuffleFan();
}

function reshuffleFan() {
  playSound('flip');
  // Pick 12 random cards from FULL_DECK for the fan
  const shuffled = [...FULL_DECK].sort(() => Math.random() - 0.5);
  appState.fanCards = shuffled.slice(0, 12).map(c => ({
    card: c,
    isReversed: Math.random() < 0.35,
    picked: false
  }));
  renderFanDeck();
  updateDrawSlotsPreview();
}

function renderFanDeck() {
  const container = document.getElementById('fanRow');
  if (!container) return;
  const total = appState.fanCards.length;
  
  container.innerHTML = appState.fanCards.map((item, idx) => {
    if (item.picked) return '';
    const angle = (idx - (total - 1) / 2) * 3.5;
    const yOffset = Math.abs(idx - (total - 1) / 2) * 2;
    return `
      <div 
        onclick="pickCard(${idx})"
        class="fan-c"
        style="width:58px;height:92px;margin:-8px;transform:rotate(${angle}deg) translateY(${yOffset}px);display:inline-block;border-radius:7px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.6);"
      >
        ${renderCardBackSVG()}
      </div>
    `;
  }).join('');
}

function pickCard(fanIdx) {
  if (appState.drawnCards.length >= appState.spread) return;
  const item = appState.fanCards[fanIdx];
  if (!item || item.picked) return;

  playSound('flip');
  item.picked = true;

  const slotIndex = appState.drawnCards.length;
  let posTitle = "Your Reality";
  if (appState.spread === 3) {
    const titles = ["Past Vibe", "Present Reality", "Upcoming Twist"];
    posTitle = titles[slotIndex] || `Card ${slotIndex + 1}`;
  }

  appState.drawnCards.push({
    card: item.card,
    isReversed: item.isReversed,
    positionTitle: posTitle,
    flipped: false
  });

  renderFanDeck();
  updateDrawSlotsPreview();

  // If complete, proceed to reading stage
  if (appState.drawnCards.length >= appState.spread) {
    setTimeout(() => {
      launchReadingStage();
    }, 450);
  }
}

function autoDraw() {
  const remaining = appState.spread - appState.drawnCards.length;
  if (remaining <= 0) return;
  
  let delay = 0;
  for (let i = 0; i < appState.fanCards.length; i++) {
    if (!appState.fanCards[i].picked && appState.drawnCards.length < appState.spread) {
      setTimeout(() => pickCard(i), delay);
      delay += 220;
    }
  }
}

function updateDrawSlotsPreview() {
  const prev = document.getElementById('slotsPrev');
  const remCount = document.getElementById('remCount');
  const needed = appState.spread - appState.drawnCards.length;
  if (remCount) remCount.innerText = needed;

  if (!prev) return;
  let html = '';
  for (let i = 0; i < appState.spread; i++) {
    const drawn = appState.drawnCards[i];
    if (drawn) {
      html += `<div class="slot-p filled"><i class="ph-bold ph-check" style="font-size:10px;margin-right:3px;"></i> ${drawn.positionTitle}</div>`;
    } else {
      let t = appState.spread === 3 ? ["Past", "Present", "Future"][i] : "Reality";
      html += `<div class="slot-p">${t}</div>`;
    }
  }
  prev.innerHTML = html;
}

// --- READING STAGE LOGIC ---
function launchReadingStage() {
  playSound('bell');
  if (appState.drawnCards.length > 0) {
    appState.drawnCards[0].flipped = true;
  }
  appState.activeTabIndex = 0;

  // Switch to stage-reading
  document.getElementById('stage-setup')?.classList.remove('active');
  document.getElementById('stage-draw')?.classList.remove('active');
  document.getElementById('stage-reading')?.classList.add('active');

  renderReadingTabs();
  renderActiveReadingTab();

  // Asynchronously query Gemini Live AI for custom witty interpretations
  fetchLiveOracleReading(appState.question, appState.category, appState.drawnCards).then(aiResult => {
    if (aiResult) {
      appState.aiReading = aiResult;
      // Re-render currently viewed tab with rich AI insight
      renderActiveReadingTab();
      renderReadingTabs();
    }
    // Save record to journal
    saveReadingToJournal();
  });
}

function renderReadingTabs() {
  const tabs = document.getElementById('readTabs');
  if (!tabs) return;

  let html = appState.drawnCards.map((item, idx) => {
    const isActive = appState.activeTabIndex === idx;
    return `
      <button onclick="selectReadingTab(${idx})" class="tab-p ${isActive ? 'active' : ''}">
        <span>${item.positionTitle}</span>
        ${item.flipped ? `<span style="font-size:10px;opacity:.8;">• ${item.card.name}</span>` : `<span>🔒</span>`}
      </button>
    `;
  }).join('');

  // Final Tea & Verdict tab
  const isVerdict = appState.activeTabIndex === appState.drawnCards.length;
  html += `
    <button onclick="selectReadingTab(${appState.drawnCards.length})" class="tab-p ${isVerdict ? 'active' : ''}" style="${isVerdict ? 'color:var(--rose);background:rgba(194,85,110,.15);border-color:rgba(194,85,110,.35);' : 'color:var(--rose);'}">
      ☕ The Tea &amp; Verdict
    </button>
  `;
  tabs.innerHTML = html;
}

function selectReadingTab(idx) {
  playSound('flip');
  appState.activeTabIndex = idx;
  if (idx < appState.drawnCards.length) {
    appState.drawnCards[idx].flipped = true;
  }
  renderReadingTabs();
  renderActiveReadingTab();
}

function flipSingleCard(idx) {
  playSound('flip');
  if (idx < appState.drawnCards.length) {
    appState.drawnCards[idx].flipped = !appState.drawnCards[idx].flipped;
    renderReadingTabs();
    renderActiveReadingTab();
  }
}

function flipAll() {
  playSound('flip');
  appState.drawnCards.forEach(c => c.flipped = true);
  renderReadingTabs();
  renderActiveReadingTab();
}

        <!-- Tea Pairing Box -->
        <div style="background:rgba(124,92,191,.1);border:1px solid rgba(124,92,191,.3);border-radius:12px;padding:12px;">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
            <span style="font-size:16px;">☕</span>
            <span class="fd" style="font-size:12px;font-weight:700;color:var(--purple-light);">Prescribed Tea Ritual: ${tea.name}</span>
          </div>
          <p style="font-size:11px;color:var(--text-muted);margin-bottom:6px;">${tea.brew} • ${tea.profile}</p>
          <p style="font-size:11px;color:var(--text);font-style:italic;">"${tea.why}"</p>
        </div>

        <!-- The Cosmic Dare -->
        <div style="background:rgba(194,85,110,.1);border:1px solid rgba(194,85,110,.35);border-radius:12px;padding:12px;">
          <span style="font-size:10px;font-weight:700;color:var(--rose);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px;">⚡ The Cosmic Dare</span>
          <p style="font-size:12px;font-weight:600;color:var(--text);line-height:1.4;">${dareText}</p>
        </div>
      </div>
    `;
    return;
  }

  // INDIVIDUAL CARD TAB
  const item = appState.drawnCards[appState.activeTabIndex];
  if (!item) return;

  const card = item.card;
  const isRev = item.isReversed;
  const cat = appState.category;
  const suitKey = card.arcana === 'Major Arcana' ? 'Major' : card.suit;
  const tea = TEA_PAIRINGS[suitKey] || TEA_PAIRINGS.Major;

  // Built-in interpretation or Live Gemini AI quip
  let oracleText = "";
  if (appState.aiReading?.interpretations?.[appState.activeTabIndex]?.oracleTake) {
    oracleText = appState.aiReading.interpretations[appState.activeTabIndex].oracleTake;
  } else {
    const opener = ORACLE.openers[card.id % ORACLE.openers.length](card.name, isRev, item.positionTitle);
    const core = isRev ? card.rev[cat] : card.up[cat];
    const closer = ORACLE.closers[cat];
    oracleText = `${opener} ${core} ${closer}`;
  }

  const kws = isRev ? card.kwRev : card.kwUp;

  panel.innerHTML = `
    <div style="flex:1;overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;gap:12px;" class="sc">
      <!-- Card Banner -->
      <div style="display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
        <div>
          <span class="badge" style="margin-bottom:4px;">${item.positionTitle}</span>
          <h2 class="fd" style="font-size:16px;color:var(--gold);font-weight:700;line-height:1.2;">
            ${card.name} ${isRev ? '<span style="font-size:11px;color:var(--rose);">(Reversed)</span>' : ''}
          </h2>
          <p style="font-size:10px;color:var(--text-muted);">${card.arcana} • ${card.element || 'Mystic'}</p>
        </div>
        <button onclick="flipSingleCard(${appState.activeTabIndex})" class="btn-gh" style="padding:6px 10px;border-radius:8px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;">
          <i class="ph-bold ph-arrows-clockwise"></i> Flip
        </button>
      </div>

      <!-- Interactive 3D Card Display -->
      <div style="display:flex;justify-content:center;padding:6px 0;flex-shrink:0;">
        <div class="perspective" style="width:130px;height:208px;cursor:pointer;" onclick="flipSingleCard(${appState.activeTabIndex})">
          <div class="c3d ${item.flipped ? 'flipped' : ''}">
            <div class="cface">${renderCardBackSVG()}</div>
            <div class="cface cface-f">${renderCardFrontSVG(card, isRev)}</div>
          </div>
        </div>
      </div>

      <!-- Keywords Tags -->
      <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;flex-shrink:0;">
        ${kws.map(k => `<span class="kw">✦ ${k}</span>`).join('')}
      </div>

      <!-- The Oracle's Roasting Decree -->
      <div class="obox" style="padding:12px 14px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <span class="fd" style="font-size:11px;font-weight:700;color:var(--gold);">The Oracle Speaks</span>
          ${appState.aiReading ? `<span class="badge" style="background:rgba(58,158,140,.15);border-color:rgba(58,158,140,.4);color:var(--teal);font-size:9px;">Live AI</span>` : ''}
        </div>
        <p style="font-size:12px;line-height:1.55;color:var(--text);font-style:italic;">${formatMarkdown(oracleText)}</p>
      </div>

      <!-- Tea Note -->
      <div style="background:rgba(28,22,48,.5);border:1px solid var(--border);border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:10px;">
        <span style="font-size:18px;">☕</span>
        <div style="font-size:11px;">
          <strong style="color:var(--gold-light);">${tea.name}:</strong>
          <span style="color:var(--text-muted);margin-left:4px;">${tea.why}</span>
        </div>
      </div>
    </div>
  `;
}

// --- UTILITIES & NAVIGATION ---
function resetToSetup() {
  playSound('tap');
  document.getElementById('stage-draw')?.classList.remove('active');
  document.getElementById('stage-reading')?.classList.remove('active');
  document.getElementById('stage-setup')?.classList.add('active');
}

function shareReading() {
  playSound('tap');
  const cardsText = appState.drawnCards.map(c => `${c.positionTitle}: ${c.card.name}${c.isReversed ? ' (Reversed)' : ''}`).join('\n');
  const shareText = `🔮 Tarot & Tea — Cosmic Reading with The Oracle\n\nQuestion: "${appState.question || 'Cosmic Inquiry'}"\n\n${cardsText}\n\nTakeaway: ${appState.aiReading?.cosmicVerdict || 'Truth served with dark tea.'}\n\nExperience it on Timeflo: ${window.location.href}`;

  if (navigator.share) {
    navigator.share({
      title: "My Tarot & Tea Reading",
      text: shareText
    }).catch(() => copyToClipboard(shareText));
  } else {
    copyToClipboard(shareText);
  }
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    alert("Cosmic reading copied to clipboard!");
  }).catch(() => {
    alert("Could not copy reading.");
  });
}

function formatMarkdown(str) {
  if (!str) return '';
  return str
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>');
}

function escapeHTML(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, m => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[m]);
}

// --- INITIALIZATION ---
window.addEventListener('DOMContentLoaded', () => {
  loadJournal();
  // Enable audio context on first user click anywhere
  document.addEventListener('click', () => initAudio(), { once: true });
});
</script>
