<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pac-Man</title>
<style>
  :root {
    --bg: #0a0a12;
    --wall: #2121de;
    --wall-glow: #4d4dff;
    --dot: #ffd8a8;
    --text: #f5f5f5;
    --accent: #ffcc00;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 30%, #14142a 0%, #05050a 100%);
    color: var(--text);
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  h1 {
    margin: 0;
    letter-spacing: 6px;
    font-size: 28px;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(255,204,0,0.6);
  }
  #hud {
    display: flex;
    gap: 24px;
    font-size: 15px;
    letter-spacing: 1px;
  }
  #hud span { color: var(--accent); }
  #canvasHolder {
    position: relative;
    border: 3px solid var(--wall-glow);
    box-shadow: 0 0 25px rgba(77,77,255,0.5), inset 0 0 15px rgba(77,77,255,0.3);
    border-radius: 6px;
  }
  canvas { display: block; background: #000; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.75);
    text-align: center;
    gap: 14px;
    border-radius: 4px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 22px; color: var(--accent); }
  #overlay p { margin: 0; font-size: 13px; color: #ccc; max-width: 280px; line-height: 1.5; }
  button {
    background: var(--accent);
    border: none;
    padding: 10px 22px;
    font-family: inherit;
    font-weight: bold;
    font-size: 14px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 0 10px rgba(255,204,0,0.5);
  }
  button:hover { filter: brightness(1.1); }
  #controls {
    display: grid;
    grid-template-columns: repeat(3, 46px);
    grid-template-rows: repeat(2, 46px);
    gap: 6px;
    margin-top: 4px;
  }
  #controls button.dir {
    background: rgba(77,77,255,0.25);
    border: 1px solid var(--wall-glow);
    color: var(--text);
    box-shadow: none;
    font-size: 18px;
    padding: 0;
  }
  #controls #up { grid-column: 2; grid-row: 1; }
  #controls #left { grid-column: 1; grid-row: 2; }
  #controls #down { grid-column: 2; grid-row: 2; }
  #controls #right { grid-column: 3; grid-row: 2; }
  #hint { font-size: 12px; color: #888; }
</style>
</head>
<body>
<div id="wrap">
  <h1>PAC-MAN</h1>
  <div id="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>LIVES: <span id="lives">3</span></div>
    <div>LEVEL: <span id="level">1</span></div>
  </div>
  <div id="canvasHolder">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h2 id="overlayTitle">PAC-MAN</h2>
      <p id="overlayText">Use arrow keys or WASD to move. Eat all the dots while avoiding the ghosts. Grab the big flashing dots to turn the tables!</p>
      <button id="startBtn">START GAME</button>
    </div>
  </div>
  <div id="hint">Arrow keys / WASD to move · tap pad on mobile</div>
  <div id="controls">
    <button class="dir" id="up">&#9650;</button>
    <button class="dir" id="left">&#9664;</button>
    <button class="dir" id="down">&#9660;</button>
    <button class="dir" id="right">&#9654;</button>
  </div>
</div>

<script>
(function(){
  // ---------- Maze layout ----------
  // 0 empty(wall corridor not walkable? no) - define legend below
  // W wall, . dot, o power pellet, ' ' empty walkable (no dot), G ghost house door area handled separately
  const layout = [
"WWWWWWWWWWWWWWWWWWWWWWWWWWW",
"W............W............W",
"W.WWW.WWWW.W.W.WWWW.WWW.W",
"WoWWW.WWWW.W.W.WWWW.WWWoW",
"W.........................W",
"W.WWW.W.WWWWWWWWW.W.WWW.W",
"W.....W......W......W.....W",
"WWWWW.WWWWW.W.WWWWW.WWWWW",
"    W.W.....HGH.....W.W    ",
"WWWWW.W.WWW.WWW.WWW.W.WWWWW",
"W............W............W",
"W.WW.WWWWW.WWWWW.WWWWW.WW.W",
"W.WW.......   G......WW.W",
"W.WWWWWW.W.WWWWW.W.WWWWWW.W",
"W.........W..W..W.........W",
"W.WWWWWWWW.W.W.W.WWWWWWWW.W",
"W..........................W",
"WWWWWWWWWWWWWWWWWWWWWWWWWWWW",
  ];
  // The above hand layout is messy for perfect symmetry; use a cleaner generated maze instead.
  const raw = [
"############################",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#o####.#####.##.#####.####o#",
"#.####.#####.##.#####.####.#",
"#..........................#",
"#.####.##.########.##.####.#",
"#.####.##.########.##.####.#",
"#......##....##....##......#",
"######.##### ## #####.######",
"     #.##### ## #####.#     ",
"     #.##          ##.#     ",
"     #.## ###--### ##.#     ",
"######.## #      # ##.######",
"      .   #      #   .      ",
"######.## #      # ##.######",
"     #.## ######## ##.#     ",
"     #.##          ##.#     ",
"     #.## ######## ##.#     ",
"######.## ######## ##.######",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#.####.#####.##.#####.####.#",
"#o..##................##..o#",
"###.##.##.########.##.##.###",
"###.##.##.########.##.##.###",
"#......##....##....##......#",
"#.##########.##.##########.#",
"#.##########.##.##########.#",
"#...........  ..............#",
"############################",
  ];

  // Normalize row lengths
  const COLS = Math.max(...raw.map(r=>r.length));
  const grid = raw.map(r => r.padEnd(COLS, ' ').split(''));
  const ROWS = grid.length;

  const TILE = 20;
  const canvas = document.getElementById('game');
  canvas.width = COLS * TILE;
  canvas.height = ROWS * TILE;
  const ctx = canvas.getContext('2d');

  function isWall(c,r){
    if (r<0||r>=ROWS) return true;
    if (c<0||c>=COLS) return false; // tunnel wrap handled separately
    const ch = grid[r][c];
    return ch === '#' || ch === '-';
  }
  function isOpen(c,r){
    if (r<0||r>=ROWS) return false;
    if (c<0) c = COLS-1;
    if (c>=COLS) c = 0;
    const ch = grid[r][c];
    return ch !== '#' && ch !== '-';
  }

  // Build dots
  let dots = [];
  let power = [];
  for (let r=0;r<ROWS;r++){
    for (let c=0;c<COLS;c++){
      const ch = grid[r][c];
      if (ch === '.') dots.push(c+','+r);
      if (ch === 'o') power.push(c+','+r);
    }
  }
  const dotSet = new Set(dots);
  const powerSet = new Set(power);
  const totalDots = dotSet.size + powerSet.size;

  // ---------- Game state ----------
  let score = 0, lives = 3, level = 1;
  let running = false;
  let paused = false;
  let frightenedTimer = 0;
  let gameOverFlag = false;

  function findSpawn(chars){
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if (chars.includes(grid[r][c])) return {c,r};
    return {c: Math.floor(COLS/2), r: Math.floor(ROWS/2)};
  }

  const pac = {
    c: 13, r: 23, dir: {x:0,y:0}, nextDir: {x:0,y:0}, speed: 0.11, moving:false, mouth:0
  };

  const ghostHouse = {c: 13, r: 11};
  const ghostColors = ['#ff3b3b', '#ff8adf', '#4dd8ff', '#ffb347'];
  let ghosts = [];

  function resetPositions(){
    pac.c = 13; pac.r = 23; pac.dir = {x:0,y:0}; pac.nextDir = {x:0,y:0};
    const startCols = [11, 13, 15, 17]; // whole-tile spawn columns, spread apart
    ghosts = ghostColors.map((color,i) => ({
      c: startCols[i], r: 11,
      x: startCols[i], y: 11,
      dir: {x: (i%2===0?1:-1), y:0},
      color, frightened:false, eaten:false,
      speed: 0.09 + level*0.004,
      id: i
    }));
    // snap ghost x/y to c/r
    ghosts.forEach(g => { g.c = g.x; g.r = g.y; });
  }
  resetPositions();

  // ---------- Input ----------
  function setDir(x,y){
    pac.nextDir = {x,y};
  }
  window.addEventListener('keydown', (e)=>{
    const k = e.key.toLowerCase();
    if (['arrowup','w'].includes(k)) { setDir(0,-1); e.preventDefault(); }
    else if (['arrowdown','s'].includes(k)) { setDir(0,1); e.preventDefault(); }
    else if (['arrowleft','a'].includes(k)) { setDir(-1,0); e.preventDefault(); }
    else if (['arrowright','d'].includes(k)) { setDir(1,0); e.preventDefault(); }
  });
  document.getElementById('up').addEventListener('click', ()=> setDir(0,-1));
  document.getElementById('down').addEventListener('click', ()=> setDir(0,1));
  document.getElementById('left').addEventListener('click', ()=> setDir(-1,0));
  document.getElementById('right').addEventListener('click', ()=> setDir(1,0));

  // ---------- Helpers ----------
  function tileCenter(c,r){ return {x: c*TILE+TILE/2, y: r*TILE+TILE/2}; }
  function canMove(c,r,dx,dy){
    const nc = Math.round(c+dx), nr = Math.round(r+dy);
    return isOpen(nc,nr);
  }

  function wrap(c){
    if (c < -0.5) return COLS-0.5;
    if (c > COLS-0.5) return -0.5;
    return c;
  }

  // Movement uses continuous float coords aligned to tile grid, moving in current dir until blocked.
  function updatePac(dt){
    // Only treat pac as "at a tile center" within a window smaller than one
    // movement step, otherwise he re-snaps to center almost every frame and
    // never actually glides forward.
    const EPS = pac.speed * 0.5;
    const rc = Math.round(pac.c), rr = Math.round(pac.r);
    const atCenter = Math.abs(pac.c - rc) < EPS && Math.abs(pac.r - rr) < EPS;

    if (atCenter) {
      pac.c = rc; pac.r = rr; // small correction only, we're already close
      if ((pac.nextDir.x || pac.nextDir.y) && canMove(rc,rr,pac.nextDir.x,pac.nextDir.y)) {
        pac.dir = {...pac.nextDir};
      }
      if (!canMove(rc,rr,pac.dir.x,pac.dir.y)) {
        pac.dir = {x:0,y:0};
      }
    }
    pac.c += pac.dir.x * pac.speed;
    pac.r += pac.dir.y * pac.speed;
    pac.c = wrap(pac.c);
    pac.mouth += pac.dir.x||pac.dir.y ? dt*0.02 : 0;

    // eat dots
    const key = Math.round(pac.c)+','+Math.round(pac.r);
    if (atCenter) {
      if (dotSet.has(key)) { dotSet.delete(key); score += 10; updateHud(); checkWin(); }
      if (powerSet.has(key)) {
        powerSet.delete(key); score += 50; updateHud(); checkWin();
        frightenedTimer = 6000;
        ghosts.forEach(g => { if(!g.eaten) g.frightened = true; });
      }
    }
  }

  function ghostDirOptions(g){
    const rc = Math.round(g.c), rr = Math.round(g.r);
    const dirs = [{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];
    const opp = {x:-g.dir.x, y:-g.dir.y};
    return dirs.filter(d => !(d.x===opp.x && d.y===opp.y) && canMove(rc,rr,d.x,d.y));
  }

  function distSq(ax,ay,bx,by){ return (ax-bx)*(ax-bx)+(ay-by)*(ay-by); }

  function updateGhost(g, dt){
    const spd0 = g.eaten ? g.speed*2.2 : (g.frightened ? g.speed*0.6 : g.speed);
    const EPS = spd0 * 0.5;
    const closeToGridR = Math.abs(g.r - Math.round(g.r)) < EPS;
    const closeToGridC = Math.abs(g.c - Math.round(g.c)) < EPS;
    if (closeToGridC && closeToGridR) {
      const rc = Math.round(g.c), rr = Math.round(g.r);
      g.c = rc; g.r = rr;
      let opts = ghostDirOptions(g);
      if (opts.length === 0) {
        // reverse forced
        opts = [{x:-g.dir.x,y:-g.dir.y}];
      }
      let target;
      if (g.eaten) {
        target = ghostHouse;
      } else if (g.frightened) {
        target = {c: Math.random()*COLS, r: Math.random()*ROWS};
      } else {
        target = {c: pac.c, r: pac.r};
      }
      // choose dir minimizing distance to target, with randomness
      opts.sort((a,b) => {
        const da = distSq(rc+a.x, rr+a.y, target.c, target.r);
        const db = distSq(rc+b.x, rr+b.y, target.c, target.r);
        return da-db;
      });
      if (g.frightened && Math.random() < 0.5) {
        g.dir = opts[Math.floor(Math.random()*opts.length)];
      } else {
        g.dir = opts[0];
      }
    }
    const spd = g.eaten ? g.speed*2.2 : (g.frightened ? g.speed*0.6 : g.speed);
    g.c += g.dir.x * spd;
    g.r += g.dir.y * spd;
    g.c = wrap(g.c);

    if (g.eaten && Math.round(g.c)===ghostHouse.c && Math.round(g.r)===ghostHouse.r) {
      g.eaten = false; g.frightened = false;
    }
  }

  function checkCollisions(){
    ghosts.forEach(g => {
      if (distSq(pac.c,pac.r,g.c,g.r) < 0.35) {
        if (g.frightened && !g.eaten) {
          g.eaten = true; g.frightened = false;
          score += 200; updateHud();
        } else if (!g.eaten) {
          loseLife();
        }
      }
    });
  }

  function loseLife(){
    lives--;
    updateHud();
    if (lives <= 0) {
      endGame(false);
    } else {
      resetPositions();
    }
  }

  function checkWin(){
    if (dotSet.size===0 && powerSet.size===0) {
      level++;
      document.getElementById('level').textContent = level;
      dots.forEach(k=>dotSet.add(k));
      power.forEach(k=>powerSet.add(k));
      resetPositions();
    }
  }

  function updateHud(){
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = lives;
    document.getElementById('level').textContent = level;
  }

  function endGame(won){
    running = false;
    gameOverFlag = true;
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('hidden');
    document.getElementById('overlayTitle').textContent = won ? 'YOU WIN!' : 'GAME OVER';
    document.getElementById('overlayText').textContent = 'Final score: ' + score;
    document.getElementById('startBtn').textContent = 'PLAY AGAIN';
  }

  // ---------- Drawing ----------
  function drawMaze(){
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = '#2121de';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#4d4dff';
    ctx.shadowBlur = 6;
    for (let r=0;r<ROWS;r++){
      for (let c=0;c<COLS;c++){
        if (grid[r][c] === '#'){
          ctx.strokeRect(c*TILE+1, r*TILE+1, TILE-2, TILE-2);
        }
      }
    }
    ctx.shadowBlur = 0;
    // dots
    ctx.fillStyle = '#ffd8a8';
    dotSet.forEach(k => {
      const [c,r] = k.split(',').map(Number);
      ctx.beginPath();
      ctx.arc(c*TILE+TILE/2, r*TILE+TILE/2, 2.2, 0, Math.PI*2);
      ctx.fill();
    });
    const pulse = 4 + Math.sin(Date.now()/150)*1.5;
    ctx.fillStyle = '#ffcc00';
    powerSet.forEach(k => {
      const [c,r] = k.split(',').map(Number);
      ctx.beginPath();
      ctx.arc(c*TILE+TILE/2, r*TILE+TILE/2, pulse, 0, Math.PI*2);
      ctx.fill();
    });
  }

  function drawPac(){
    const x = pac.c*TILE+TILE/2, y = pac.r*TILE+TILE/2;
    let angle = 0;
    if (pac.dir.x===1) angle=0;
    else if (pac.dir.x===-1) angle=Math.PI;
    else if (pac.dir.y===-1) angle=-Math.PI/2;
    else if (pac.dir.y===1) angle=Math.PI/2;
    const open = Math.abs(Math.sin(Date.now()/100))*0.25+0.05;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(angle);
    ctx.fillStyle = '#ffe600';
    ctx.shadowColor = '#ffe600';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(0,0,TILE/2-1, open*Math.PI, (2-open)*Math.PI);
    ctx.lineTo(0,0);
    ctx.fill();
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  function drawGhost(g){
    const x = g.c*TILE+TILE/2, y = g.r*TILE+TILE/2;
    const radius = TILE/2-1;
    let color = g.color;
    if (g.eaten) {
      // eyes only
      drawEyes(x,y,g.dir);
      return;
    }
    if (g.frightened) {
      color = frightenedTimer < 1500 && Math.floor(Date.now()/200)%2===0 ? '#ffffff' : '#2121ff';
    }
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y-1, radius, Math.PI, 0);
    ctx.lineTo(x+radius, y+radius-2);
    for (let i=0;i<4;i++){
      const bx = x+radius - (i+0.5)*(radius*2/4);
      const by = (i%2===0) ? y+radius-2 : y+radius-6;
      ctx.lineTo(bx, by);
    }
    ctx.lineTo(x-radius, y-1);
    ctx.closePath();
    ctx.fill();
    if (!g.frightened) drawEyes(x,y,g.dir);
    else {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x-4,y-1,2,0,Math.PI*2); ctx.arc(x+4,y-1,2,0,Math.PI*2); ctx.fill();
    }
  }
  function drawEyes(x,y,dir){
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x-4,y-2,3.2,0,Math.PI*2); ctx.arc(x+4,y-2,3.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1aff';
    const ox = dir.x*1.5, oy = dir.y*1.5;
    ctx.beginPath(); ctx.arc(x-4+ox,y-2+oy,1.4,0,Math.PI*2); ctx.arc(x+4+ox,y-2+oy,1.4,0,Math.PI*2); ctx.fill();
  }

  // ---------- Main loop ----------
  let lastTime = 0;
  function loop(ts){
    if (!running) return;
    const dt = Math.min(ts-lastTime, 40);
    lastTime = ts;

    if (frightenedTimer > 0) {
      frightenedTimer -= dt;
      if (frightenedTimer <= 0) {
        frightenedTimer = 0;
        ghosts.forEach(g => g.frightened = false);
      }
    }

    updatePac(dt);
    ghosts.forEach(g => updateGhost(g, dt));
    checkCollisions();

    drawMaze();
    drawPac();
    ghosts.forEach(drawGhost);

    requestAnimationFrame(loop);
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    score = 0; lives = 3; level = 1; gameOverFlag = false;
    dots.forEach(k=>dotSet.add(k));
    power.forEach(k=>powerSet.add(k));
    resetPositions();
    updateHud();
    document.getElementById('overlay').classList.add('hidden');
    running = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  });

  // initial draw
  drawMaze();
})();
</script>
</body>
</html>
