<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Mandala Maker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap');

        :root {
            --ink: #ede3d3;
            --ink-dim: #b8ab99;
            --bg-deep: #16101e;
            --bg-panel: #1f1729;
            --bg-panel-2: #261c33;
            --line: rgba(237, 227, 211, 0.12);
            --line-strong: rgba(237, 227, 211, 0.22);
            --gold: #c9a15a;
            --rose: #d98fa3;
            --teal: #5fa89f;
            --sage: #8fae6f;
            --lilac: #9c8fd9;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: radial-gradient(120% 140% at 50% 10%, #211730 0%, var(--bg-deep) 55%, #0f0a16 100%);
            color: var(--ink);
            font-family: 'Jost', sans-serif;
            overflow: hidden;
        }

        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header {
            position: absolute;
            top: 26px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }

        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-size: 26px;
            letter-spacing: 0.14em;
            margin: 0;
            color: var(--ink);
            opacity: 0.92;
        }

        header p {
            margin: 4px 0 0;
            font-size: 12px;
            letter-spacing: 0.12em;
            color: var(--ink-dim);
            text-transform: uppercase;
            font-weight: 300;
        }

        #canvas-wrap {
            position: relative;
            border-radius: 50%;
            box-shadow: 0 0 0 1px var(--line), 0 40px 90px -30px rgba(0, 0, 0, 0.7);
        }

        #glow {
            position: absolute;
            inset: -60px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201, 161, 90, 0.10) 0%, rgba(201, 161, 90, 0.0) 60%);
            animation: breathe 7s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes breathe {

            0%,
            100% {
                transform: scale(0.96);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.04);
                opacity: 1;
            }
        }

        canvas {
            display: block;
            border-radius: 50%;
            background: #1a1424;
            touch-action: none;
            cursor: crosshair;
        }

        #guideCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        #drawCanvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        /* control dock */
        #dock {
            position: absolute;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(31, 23, 41, 0.82);
            backdrop-filter: blur(10px);
            border: 0.5px solid var(--line-strong);
            border-radius: 999px;
            padding: 10px 18px;
            z-index: 6;
            max-width: 94vw;
            overflow-x: auto;
        }

        .swatch {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            flex: none;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .swatch:hover {
            transform: scale(1.12);
        }

        .swatch.active {
            border-color: var(--ink);
            transform: scale(1.15);
        }

        .divider {
            width: 1px;
            height: 26px;
            background: var(--line-strong);
            flex: none;
        }

        .dock-btn {
            background: transparent;
            border: 0.5px solid var(--line-strong);
            color: var(--ink);
            font-family: 'Jost', sans-serif;
            font-size: 12px;
            letter-spacing: 0.06em;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s ease, border-color 0.15s ease;
            flex: none;
        }

        .dock-btn:hover {
            background: rgba(237, 227, 211, 0.06);
            border-color: var(--gold);
        }

        .dock-btn.icon {
            width: 34px;
            height: 34px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        #sliceLabel {
            font-size: 12px;
            color: var(--ink-dim);
            min-width: 46px;
            flex: none;
            text-align: center;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 90px;
            height: 2px;
            background: var(--line-strong);
            border-radius: 2px;
            flex: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--gold);
            cursor: pointer;
            margin-top: -5px;
        }

        input[type=range]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--gold);
            border: none;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-runnable-track {
            height: 2px;
            background: var(--line-strong);
            border-radius: 2px;
        }

        #topRight {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 6;
            display: flex;
            gap: 8px;
        }

        #settle {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.1s ease;
        }

        #settle p {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: var(--ink-dim);
            font-size: 15px;
            letter-spacing: 0.04em;
        }

        ::-webkit-scrollbar {
            height: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--line-strong);
            border-radius: 2px;
        }

        @media (max-width: 640px) {
            header h1 {
                font-size: 20px;
            }

            #dock {
                gap: 10px;
                padding: 8px 12px;
            }

            input[type=range] {
                width: 60px;
            }
        }
    </style>
</head>

<body>

    <div id="settle">
        <p>settling in&hellip;</p>
    </div>

    <div id="app">
        <header>
            <h1>Mandala Maker</h1>
            <p>draw once, see it bloom</p>
        </header>

        <div id="topRight">
            <button class="dock-btn icon" id="guideToggle" title="Toggle guide lines" aria-label="Toggle guide lines">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                    <circle cx="12" cy="12" r="9" />
                    <line x1="12" y1="3" x2="12" y2="21" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                </svg>
            </button>
        </div>

        <div id="canvas-wrap">
            <div id="glow"></div>
            <canvas id="guideCanvas"></canvas>
            <canvas id="drawCanvas"></canvas>
        </div>

        <div id="dock">
            <span id="sliceLabel">12 fold</span>
            <input type="range" id="sliceSlider" min="4" max="28" step="2" value="12">
            <div class="divider"></div>
            <input type="range" id="sizeSlider" min="1" max="16" step="1" value="4" title="Brush size">
            <div class="divider"></div>
            <div class="swatch active" data-color="#c9a15a" style="background:#c9a15a"></div>
            <div class="swatch" data-color="#d98fa3" style="background:#d98fa3"></div>
            <div class="swatch" data-color="#5fa89f" style="background:#5fa89f"></div>
            <div class="swatch" data-color="#8fae6f" style="background:#8fae6f"></div>
            <div class="swatch" data-color="#9c8fd9" style="background:#9c8fd9"></div>
            <div class="swatch" data-color="#ede3d3" style="background:#ede3d3"></div>
            <input type="color" id="customColor" value="#c9a15a"
                style="width:22px;height:22px;padding:0;border:none;border-radius:50%;background:none;cursor:pointer;flex:none;">
            <div class="divider"></div>
            <button class="dock-btn" id="mirrorBtn">mirror: off</button>
            <button class="dock-btn" id="clearBtn">begin again</button>
            <button class="dock-btn" id="saveBtn">save</button>
        </div>
    </div>

    <script>
        (function () {
            const wrap = document.getElementById('canvas-wrap');
            const guideCanvas = document.getElementById('guideCanvas');
            const drawCanvas = document.getElementById('drawCanvas');
            const gctx = guideCanvas.getContext('2d');
            const dctx = drawCanvas.getContext('2d');

            let size = 0;
            let dpr = Math.max(1, window.devicePixelRatio || 1);
            let slices = 12;
            let brushColor = '#c9a15a';
            let brushSize = 4;
            let mirrorOn = false;
            let showGuides = true;

            function computeSize() {
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const avail = Math.min(vw, vh) - (vw < 640 ? 130 : 170);
                return Math.max(240, Math.min(640, avail));
            }

            function resize(preserve) {
                let snapshot = null;
                if (preserve && size > 0) {
                    snapshot = document.createElement('canvas');
                    snapshot.width = drawCanvas.width;
                    snapshot.height = drawCanvas.height;
                    snapshot.getContext('2d').drawImage(drawCanvas, 0, 0);
                }

                size = computeSize();
                dpr = Math.max(1, window.devicePixelRatio || 1);

                [guideCanvas, drawCanvas].forEach(c => {
                    c.style.width = size + 'px';
                    c.style.height = size + 'px';
                    c.width = size * dpr;
                    c.height = size * dpr;
                });
                wrap.style.width = size + 'px';
                wrap.style.height = size + 'px';

                gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                dctx.lineCap = 'round';
                dctx.lineJoin = 'round';

                if (snapshot) {
                    dctx.drawImage(snapshot, 0, 0, snapshot.width, snapshot.height, 0, 0, size, size);
                }

                drawGuides();
            }

            function drawGuides() {
                gctx.clearRect(0, 0, size, size);
                if (!showGuides) return;
                const cx = size / 2, cy = size / 2, r = size / 2 - 2;
                gctx.save();
                gctx.strokeStyle = 'rgba(237,227,211,0.14)';
                gctx.lineWidth = 1;

                // concentric rings
                for (let i = 1; i <= 4; i++) {
                    gctx.beginPath();
                    gctx.arc(cx, cy, r * i / 4, 0, Math.PI * 2);
                    gctx.stroke();
                }
                // spokes
                gctx.strokeStyle = 'rgba(237,227,211,0.09)';
                for (let i = 0; i < slices; i++) {
                    const a = (Math.PI * 2 / slices) * i;
                    gctx.beginPath();
                    gctx.moveTo(cx, cy);
                    gctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
                    gctx.stroke();
                }
                gctx.restore();
            }

            function getPoint(e) {
                const rect = drawCanvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            let drawing = false;
            let last = null;

            function strokeSegment(p0, p1) {
                const cx = size / 2, cy = size / 2;
                const dx0 = p0.x - cx, dy0 = p0.y - cy;
                const dx1 = p1.x - cx, dy1 = p1.y - cy;

                dctx.strokeStyle = brushColor;
                dctx.lineWidth = brushSize;
                dctx.globalAlpha = 0.92;

                for (let i = 0; i < slices; i++) {
                    const a = (Math.PI * 2 / slices) * i;
                    const cos = Math.cos(a), sin = Math.sin(a);

                    const x0 = cx + (dx0 * cos - dy0 * sin);
                    const y0 = cy + (dx0 * sin + dy0 * cos);
                    const x1 = cx + (dx1 * cos - dy1 * sin);
                    const y1 = cy + (dx1 * sin + dy1 * cos);

                    dctx.beginPath();
                    dctx.moveTo(x0, y0);
                    dctx.lineTo(x1, y1);
                    dctx.stroke();

                    if (mirrorOn) {
                        const mx0 = cx + (dx0 * cos + dy0 * sin);
                        const my0 = cy + (-dx0 * sin + dy0 * cos);
                        const mx1 = cx + (dx1 * cos + dy1 * sin);
                        const my1 = cy + (-dx1 * sin + dy1 * cos);
                        dctx.beginPath();
                        dctx.moveTo(mx0, my0);
                        dctx.lineTo(mx1, my1);
                        dctx.stroke();
                    }
                }
            }

            function pointerDown(e) {
                e.preventDefault();
                drawing = true;
                last = getPoint(e);
                // dot for a single tap
                strokeSegment(last, { x: last.x + 0.01, y: last.y + 0.01 });
            }
            function pointerMove(e) {
                if (!drawing) return;
                e.preventDefault();
                const p = getPoint(e);
                strokeSegment(last, p);
                last = p;
            }
            function pointerUp() {
                drawing = false;
                last = null;
            }

            drawCanvas.addEventListener('mousedown', pointerDown);
            drawCanvas.addEventListener('mousemove', pointerMove);
            window.addEventListener('mouseup', pointerUp);
            drawCanvas.addEventListener('touchstart', pointerDown, { passive: false });
            drawCanvas.addEventListener('touchmove', pointerMove, { passive: false });
            drawCanvas.addEventListener('touchend', pointerUp);

            // controls
            const sliceSlider = document.getElementById('sliceSlider');
            const sliceLabel = document.getElementById('sliceLabel');
            sliceSlider.addEventListener('input', () => {
                slices = parseInt(sliceSlider.value, 10);
                sliceLabel.textContent = slices + ' fold';
                drawGuides();
            });

            const sizeSlider = document.getElementById('sizeSlider');
            sizeSlider.addEventListener('input', () => {
                brushSize = parseInt(sizeSlider.value, 10);
            });

            document.querySelectorAll('.swatch').forEach(sw => {
                sw.addEventListener('click', () => {
                    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
                    sw.classList.add('active');
                    brushColor = sw.getAttribute('data-color');
                    document.getElementById('customColor').value = brushColor;
                });
            });
            document.getElementById('customColor').addEventListener('input', (e) => {
                document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
                brushColor = e.target.value;
            });

            const mirrorBtn = document.getElementById('mirrorBtn');
            mirrorBtn.addEventListener('click', () => {
                mirrorOn = !mirrorOn;
                mirrorBtn.textContent = 'mirror: ' + (mirrorOn ? 'on' : 'off');
            });

            const guideToggle = document.getElementById('guideToggle');
            guideToggle.addEventListener('click', () => {
                showGuides = !showGuides;
                drawGuides();
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                drawCanvas.style.transition = 'opacity 0.5s ease';
                drawCanvas.style.opacity = '0';
                setTimeout(() => {
                    dctx.clearRect(0, 0, size, size);
                    drawCanvas.style.opacity = '1';
                }, 500);
            });

            document.getElementById('saveBtn').addEventListener('click', () => {
                const out = document.createElement('canvas');
                out.width = drawCanvas.width;
                out.height = drawCanvas.height;
                const octx = out.getContext('2d');
                octx.fillStyle = '#1a1424';
                octx.beginPath();
                octx.arc(out.width / 2, out.height / 2, out.width / 2, 0, Math.PI * 2);
                octx.fill();
                octx.drawImage(drawCanvas, 0, 0);
                const link = document.createElement('a');
                link.download = 'mandala.png';
                link.href = out.toDataURL('image/png');
                link.click();
            });

            window.addEventListener('resize', () => resize(true));
            resize(false);

            setTimeout(() => {
                const settle = document.getElementById('settle');
                settle.style.opacity = '0';
                setTimeout(() => settle.remove(), 1200);
            }, 500);
        })();
    </script>
</body>

</html>
