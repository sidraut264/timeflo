<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEON PONG :: 20 POWER-UPS</title>
<style>
  :root{
    --bg: #06080d;
    --grid: #10151f;
    --cyan: #4deeea;
    --magenta: #ff2e88;
    --amber: #ffd23f;
    --violet: #8b7bff;
    --panel: #0b0f18;
    --text: #cfe8ff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 50% 0%, rgba(139,123,255,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family: 'Courier New', Consolas, monospace;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .cabinet{
    display:flex; gap:18px; align-items:flex-start;
    padding:22px;
  }
  .screen-wrap{
    position:relative;
    border-radius:14px;
    padding:14px;
    background:linear-gradient(180deg,#12182a,#080b12);
    box-shadow: 0 0 0 1px rgba(77,238,234,0.15), 0 20px 60px rgba(0,0,0,0.6), inset 0 0 30px rgba(77,238,234,0.05);
  }
  .titlebar{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:10px; padding:0 4px;
  }
  h1{
    font-size:20px; letter-spacing:6px; margin:0;
    color:var(--cyan);
    text-shadow: 0 0 6px var(--cyan), 0 0 22px rgba(77,238,234,0.5);
  }
  .sub{
    font-size:10px; letter-spacing:2px; color:var(--violet); opacity:0.8;
  }
  canvas{
    display:block;
    background:
      repeating-linear-gradient(0deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 26px),
      repeating-linear-gradient(90deg, var(--grid) 0px, var(--grid) 1px, transparent 1px, transparent 26px),
      #05070c;
    border-radius:6px;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
  }
  .scanlines{
    position:absolute; inset:14px; border-radius:6px; pointer-events:none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 2px, transparent 3px);
    mix-blend-mode:overlay;
  }
  .hud{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:10px; padding:0 4px; font-size:11px; letter-spacing:1px; color:#9fb4cc;
  }
  .scorebox{
    display:flex; gap:26px; justify-content:center; margin:6px 0 4px;
  }
  .score{
    font-size:38px; letter-spacing:4px;
    text-shadow: 0 0 10px currentColor;
  }
  .score.p1{color:var(--cyan);}
  .score.p2{color:var(--magenta);}
  .controls-row{
    display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;
  }
  button{
    background:var(--panel); color:var(--text);
    border:1px solid rgba(77,238,234,0.35);
    padding:8px 12px; border-radius:6px; cursor:pointer;
    font-family:inherit; font-size:11px; letter-spacing:1px;
    transition: all .15s ease;
  }
  button:hover{ background:rgba(77,238,234,0.12); box-shadow:0 0 12px rgba(77,238,234,0.3); }
  button.active{ border-color:var(--magenta); color:var(--magenta); box-shadow:0 0 12px rgba(255,46,136,0.35); }
  .panel{
    width:250px; background:var(--panel);
    border:1px solid rgba(139,123,255,0.2);
    border-radius:12px; padding:16px;
    max-height:640px; overflow-y:auto;
  }
  .panel h2{
    font-size:12px; letter-spacing:3px; color:var(--violet);
    margin:0 0 10px; border-bottom:1px dashed rgba(139,123,255,0.3); padding-bottom:8px;
  }
  .legend-item{
    display:flex; gap:8px; align-items:flex-start;
    font-size:10.5px; line-height:1.4; margin-bottom:9px; color:#a9c1da;
  }
  .legend-icon{
    width:16px; height:16px; flex:none; border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:bold; margin-top:1px;
  }
  .legend-item b{ color:#e6f2ff; }
  .tag-self{ background:rgba(77,238,234,0.15); color:var(--cyan); border:1px solid rgba(77,238,234,0.4);}
  .tag-foe{ background:rgba(255,46,136,0.15); color:var(--magenta); border:1px solid rgba(255,46,136,0.4);}
  .tag-neu{ background:rgba(255,210,63,0.15); color:var(--amber); border:1px solid rgba(255,210,63,0.4);}
  .legend-tag{
    font-size:8px; letter-spacing:1px; padding:1px 5px; border-radius:3px; margin-left:6px;
  }
  .toast-layer{
    position:absolute; top:60px; left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    pointer-events:none;
  }
  .toast{
    background:rgba(8,11,18,0.9); border:1px solid var(--amber);
    color:var(--amber); padding:6px 14px; border-radius:20px;
    font-size:11px; letter-spacing:1px;
    box-shadow:0 0 14px rgba(255,210,63,0.4);
    animation: fadeup 2.2s ease forwards;
  }
  @keyframes fadeup{
    0%{ opacity:0; transform:translateY(-6px);}
    12%{ opacity:1; transform:translateY(0);}
    80%{ opacity:1;}
    100%{ opacity:0; transform:translateY(-8px);}
  }
  .overlay{
    position:absolute; inset:14px; border-radius:6px;
    background:rgba(5,7,12,0.86);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:14px; padding:20px;
  }
  .overlay h2{ font-size:22px; letter-spacing:4px; color:var(--cyan); text-shadow:0 0 10px var(--cyan); margin:0;}
  .overlay p{ font-size:12px; color:#9fb4cc; max-width:420px; line-height:1.6; margin:0;}
  .hidden{ display:none !important; }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(139,123,255,0.35); border-radius:4px; }
</style>
</head>
<body>
<div class="cabinet">
  <div class="screen-wrap">
    <div class="titlebar">
      <h1>NEON PONG</h1>
      <div class="sub">20 POWER-UPS ONLINE</div>
    </div>
    <div class="scorebox">
      <div class="score p1" id="scoreP1">0</div>
      <div class="score p2" id="scoreP2">0</div>
    </div>
    <div style="position:relative;">
      <canvas id="game" width="760" height="480"></canvas>
      <div class="scanlines"></div>
      <div class="toast-layer" id="toastLayer"></div>
      <div class="overlay" id="startOverlay">
        <h2>NEON PONG</h2>
        <p>First to <b>7</b> wins. Ball collects power-ups &mdash; the paddle that last touched it gets the buff, or curses the opponent. Chaos guaranteed.</p>
        <p id="controlsHint">P1: W / S &nbsp;&nbsp;|&nbsp;&nbsp; P2: &uarr; / &darr; (or toggle AI below)</p>
        <button id="beginBtn" style="padding:12px 22px; font-size:13px;">PRESS START</button>
      </div>
      <div class="overlay hidden" id="pointOverlay">
        <h2 id="pointMsg">POINT!</h2>
        <button id="continueBtn" style="padding:10px 20px;">CONTINUE</button>
      </div>
      <div class="overlay hidden" id="winOverlay">
        <h2 id="winMsg">WINS!</h2>
        <button id="restartBtn" style="padding:10px 20px;">PLAY AGAIN</button>
      </div>
    </div>
    <div class="hud">
      <span id="statusLine">Ready.</span>
      <span>SPACE: pause</span>
    </div>
    <div class="controls-row">
      <button id="modeBtn" class="active">MODE: VS AI</button>
      <button id="pauseBtn">PAUSE</button>
      <button id="muteBtn">SOUND: ON</button>
    </div>
  </div>
  <div class="panel">
    <h2>POWER-UP LEGEND</h2>
    <div id="legendList"></div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------- Audio (tiny synth beeps, no external files) ----------
  let audioCtx = null, soundOn = true;
  function beep(freq, dur, type='square', vol=0.05){
    if(!soundOn) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    }catch(e){}
  }

  // ---------- Game constants ----------
  const PADDLE_W = 12, PADDLE_H_BASE = 70, PADDLE_SPEED_BASE = 6.2;
  const BALL_R_BASE = 8;
  const WIN_SCORE = 7;

  // ---------- State ----------
  let mode = 'ai'; // 'ai' or '2p'
  let paused = false, running = false;
  let score = {p1:0, p2:0};
  let keys = {};

  function freshPaddle(x, isLeft){
    return {
      x, y: H/2 - PADDLE_H_BASE/2,
      w: PADDLE_W, h: PADDLE_H_BASE, baseH: PADDLE_H_BASE,
      speed: PADDLE_SPEED_BASE, baseSpeed: PADDLE_SPEED_BASE,
      isLeft,
      reversed:false, frozen:false, sticky:false, magnet:false,
      shield:0, doublePoints:false, lockZone:null,
      effects:{} // name -> expiry timestamp
    };
  }
  let p1 = freshPaddle(24, true);
  let p2 = freshPaddle(W-24-PADDLE_W, false);

  function freshBall(vx, vy){
    return {
      x:W/2, y:H/2, r:BALL_R_BASE, baseR: BALL_R_BASE,
      vx, vy, speedMul:1, ghost:false, invisible:false, curve:0,
      lastHit:null, // 'p1' or 'p2'
      stuckTo:null, stuckTimer:0
    };
  }
  let balls = [freshBall(5.5,3)];

  let particles = [];
  let powerups = []; // {x,y,r,type,spawnT}
  let effectsTimers = {}; // global gravity well etc
  let gravityWellUntil = 0;
  let nextPowerupAt = 0;

  // ---------- Power-up definitions ----------
  // category: self (benefits whoever hit ball last), foe (hurts the other paddle), neutral (affects ball/both)
  const POWERUPS = [
    {id:'grow', name:'Grow Paddle', cat:'self', color:'#4deeea', icon:'G', desc:'Your paddle grows taller for 10s.'},
    {id:'shrink', name:'Shrink Paddle', cat:'foe', color:'#ff2e88', icon:'S', desc:'Opponent paddle shrinks for 10s.'},
    {id:'speedboost', name:'Speed Boost', cat:'self', color:'#4deeea', icon:'»', desc:'Your paddle moves faster for 10s.'},
    {id:'slowpaddle', name:'Slow Paddle', cat:'foe', color:'#ff2e88', icon:'«', desc:'Opponent paddle moves slower for 10s.'},
    {id:'fastball', name:'Fast Ball', cat:'neutral', color:'#ffd23f', icon:'F', desc:'Ball speeds up for everyone.'},
    {id:'slowball', name:'Slow Ball', cat:'neutral', color:'#ffd23f', icon:'Z', desc:'Ball slows down for everyone.'},
    {id:'multiball', name:'Multi-Ball', cat:'neutral', color:'#ffd23f', icon:'M', desc:'Spawns an extra ball in play.'},
    {id:'sticky', name:'Sticky Paddle', cat:'self', color:'#4deeea', icon:'•', desc:'Next hit sticks the ball briefly before launch.'},
    {id:'reverse', name:'Reverse Controls', cat:'foe', color:'#ff2e88', icon:'R', desc:'Opponent controls are inverted for 8s.'},
    {id:'freeze', name:'Freeze Paddle', cat:'foe', color:'#ff2e88', icon:'❄', desc:'Opponent paddle is frozen for 2.5s.'},
    {id:'invisible', name:'Invisible Ball', cat:'neutral', color:'#ffd23f', icon:'?', desc:'Ball turns invisible for a moment.'},
    {id:'magnet', name:'Magnet Paddle', cat:'self', color:'#4deeea', icon:'⊕', desc:'Your paddle gently pulls the ball for 10s.'},
    {id:'shield', name:'Shield', cat:'self', color:'#4deeea', icon:'⛊', desc:'Blocks the next point scored against you.'},
    {id:'ghost', name:'Ghost Ball', cat:'self', color:'#4deeea', icon:'G', desc:'Ball phases through the opponent once.'},
    {id:'curve', name:'Curveball', cat:'self', color:'#4deeea', icon:'~', desc:'Your next shots curve unpredictably.'},
    {id:'giant', name:'Giant Ball', cat:'neutral', color:'#ffd23f', icon:'O', desc:'Ball grows large for 10s.'},
    {id:'tiny', name:'Tiny Ball', cat:'neutral', color:'#ffd23f', icon:'o', desc:'Ball shrinks small for 10s.'},
    {id:'doublepoints', name:'Double Points', cat:'self', color:'#4deeea', icon:'2x', desc:'Your next point counts double.'},
    {id:'gravity', name:'Gravity Well', cat:'neutral', color:'#ffd23f', icon:'@', desc:'A well at center bends the ball\'s path.'},
    {id:'lockdown', name:'Lockdown Zone', cat:'foe', color:'#ff2e88', icon:'X', desc:'Opponent movement range is restricted for 10s.'},
  ];

  function buildLegend(){
    const list = document.getElementById('legendList');
    list.innerHTML = '';
    POWERUPS.forEach(p=>{
      const row = document.createElement('div');
      row.className = 'legend-item';
      const tagClass = p.cat==='self'?'tag-self':(p.cat==='foe'?'tag-foe':'tag-neu');
      const tagLabel = p.cat==='self'?'BUFF':(p.cat==='foe'?'CURSE':'CHAOS');
      row.innerHTML = `<div class="legend-icon" style="background:${p.color}22;color:${p.color};border:1px solid ${p.color}66;">${p.icon}</div>
        <div><b>${p.name}</b><span class="legend-tag ${tagClass}">${tagLabel}</span><br>${p.desc}</div>`;
      list.appendChild(row);
    });
  }
  buildLegend();

  // ---------- Input ----------
  window.addEventListener('keydown', e=>{
    keys[e.code] = true;
    if(e.code === 'Space'){ e.preventDefault(); togglePause(); }
    if(['ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', e=>{ keys[e.code] = false; });

  document.getElementById('modeBtn').addEventListener('click', function(){
    mode = (mode === 'ai') ? '2p' : 'ai';
    this.textContent = 'MODE: ' + (mode==='ai' ? 'VS AI' : '2 PLAYER');
    document.getElementById('controlsHint').textContent = mode==='ai'
      ? 'P1: W / S  —  AI controls right paddle'
      : 'P1: W / S   |   P2: ↑ / ↓';
  });
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('muteBtn').addEventListener('click', function(){
    soundOn = !soundOn;
    this.textContent = 'SOUND: ' + (soundOn?'ON':'OFF');
  });
  document.getElementById('beginBtn').addEventListener('click', startGame);
  document.getElementById('continueBtn').addEventListener('click', ()=>{
    document.getElementById('pointOverlay').classList.add('hidden');
    resumeAfterPoint();
  });
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    score.p1=0; score.p2=0;
    updateScore();
    document.getElementById('winOverlay').classList.add('hidden');
    startGame();
  });

  function togglePause(){
    if(!running) return;
    paused = !paused;
    document.getElementById('pauseBtn').textContent = paused ? 'RESUME' : 'PAUSE';
    document.getElementById('statusLine').textContent = paused ? 'Paused.' : 'Playing…';
  }

  function startGame(){
    document.getElementById('startOverlay').classList.add('hidden');
    p1 = freshPaddle(24, true);
    p2 = freshPaddle(W-24-PADDLE_W, false);
    balls = [freshBall(Math.random()<0.5?5.5:-5.5, (Math.random()*4-2))];
    powerups = [];
    particles = [];
    gravityWellUntil = 0;
    nextPowerupAt = performance.now() + 4000;
    running = true; paused = false;
    document.getElementById('statusLine').textContent = 'Playing…';
    document.getElementById('pauseBtn').textContent = 'PAUSE';
    requestAnimationFrame(loop);
  }

  function updateScore(){
    document.getElementById('scoreP1').textContent = score.p1;
    document.getElementById('scoreP2').textContent = score.p2;
  }

  function toast(msg, color){
    const layer = document.getElementById('toastLayer');
    const el = document.createElement('div');
    el.className = 'toast';
    el.style.color = color || '#ffd23f';
    el.style.borderColor = color || '#ffd23f';
    el.textContent = msg;
    layer.appendChild(el);
    setTimeout(()=> el.remove(), 2300);
  }

  // ---------- Power-up spawning ----------
  function spawnPowerup(){
    const def = POWERUPS[Math.floor(Math.random()*POWERUPS.length)];
    const margin = 90;
    powerups.push({
      x: margin + Math.random()*(W - margin*2),
      y: 40 + Math.random()*(H-80),
      r: 14,
      def,
      born: performance.now()
    });
  }

  function applyPowerup(def, ownerKey){
    const owner = ownerKey === 'p1' ? p1 : p2;
    const foe = ownerKey === 'p1' ? p2 : p1;
    const now = performance.now();
    const color = def.color;
    toast((ownerKey==='p1'?'P1 ':'P2 ') + def.name + '!', color);
    beep(def.cat==='foe'?220:660, 0.12, def.cat==='foe'?'sawtooth':'square');

    switch(def.id){
      case 'grow':
        owner.h = owner.baseH * 1.7;
        owner.effects.grow = now + 10000;
        break;
      case 'shrink':
        foe.h = foe.baseH * 0.55;
        foe.effects.shrink = now + 10000;
        break;
      case 'speedboost':
        owner.speed = owner.baseSpeed * 1.8;
        owner.effects.speedboost = now + 10000;
        break;
      case 'slowpaddle':
        foe.speed = foe.baseSpeed * 0.5;
        foe.effects.slowpaddle = now + 10000;
        break;
      case 'fastball':
        balls.forEach(b=>b.speedMul = Math.min(2.4, b.speedMul*1.35));
        break;
      case 'slowball':
        balls.forEach(b=>b.speedMul = Math.max(0.5, b.speedMul*0.7));
        break;
      case 'multiball':
        if(balls.length < 5){
          const src = balls[0];
          const ang = Math.random()*Math.PI*2;
          balls.push(freshBall(Math.cos(ang)*5.5, Math.sin(ang)*5.5));
        }
        break;
      case 'sticky':
        owner.sticky = true;
        owner.effects.sticky = now + 12000;
        break;
      case 'reverse':
        foe.reversed = true;
        foe.effects.reverse = now + 8000;
        break;
      case 'freeze':
        foe.frozen = true;
        foe.effects.freeze = now + 2500;
        break;
      case 'invisible':
        balls.forEach(b=>{ b.invisible = true; setTimeout(()=>{ b.invisible=false; }, 1800); });
        break;
      case 'magnet':
        owner.magnet = true;
        owner.effects.magnet = now + 10000;
        break;
      case 'shield':
        owner.shield += 1;
        break;
      case 'ghost':
        balls.forEach(b=>{ if(b.lastHit===ownerKey) b.ghost = true; });
        if(balls.every(b=>b.lastHit!==ownerKey) && balls[0]) balls[0].ghost = true;
        break;
      case 'curve':
        owner.curveCharge = true;
        owner.effects.curve = now + 12000;
        break;
      case 'giant':
        balls.forEach(b=>b.r = b.baseR*2.1);
        setTimeout(()=>{ balls.forEach(b=>b.r = b.baseR); }, 10000);
        break;
      case 'tiny':
        balls.forEach(b=>b.r = b.baseR*0.5);
        setTimeout(()=>{ balls.forEach(b=>b.r = b.baseR); }, 10000);
        break;
      case 'doublepoints':
        owner.doublePoints = true;
        break;
      case 'gravity':
        gravityWellUntil = now + 9000;
        break;
      case 'lockdown':
        foe.lockZone = {min: H*0.28, max: H*0.72};
        foe.effects.lockdown = now + 10000;
        break;
    }
  }

  function clearExpiredEffects(paddle){
    const now = performance.now();
    for(const key in paddle.effects){
      if(paddle.effects[key] < now){
        delete paddle.effects[key];
        switch(key){
          case 'grow': paddle.h = paddle.baseH; break;
          case 'shrink': paddle.h = paddle.baseH; break;
          case 'speedboost': paddle.speed = paddle.baseSpeed; break;
          case 'slowpaddle': paddle.speed = paddle.baseSpeed; break;
          case 'sticky': paddle.sticky = false; break;
          case 'reverse': paddle.reversed = false; break;
          case 'freeze': paddle.frozen = false; break;
          case 'magnet': paddle.magnet = false; break;
          case 'curve': paddle.curveCharge = false; break;
          case 'lockdown': paddle.lockZone = null; break;
        }
      }
    }
  }

  // ---------- Physics ----------
  function movePaddle(paddle, up, down, dt){
    if(paddle.frozen) return;
    let dir = 0;
    if(up) dir -= 1;
    if(down) dir += 1;
    if(paddle.reversed) dir *= -1;
    paddle.y += dir * paddle.speed * dt;
    const minY = paddle.lockZone ? paddle.lockZone.min : 0;
    const maxY = (paddle.lockZone ? paddle.lockZone.max : H) - paddle.h;
    paddle.y = Math.max(minY, Math.min(maxY, paddle.y));
  }

  function aiMove(paddle, ball, dt){
    if(paddle.frozen) return;
    const target = ball.y - paddle.h/2 + (Math.random()*10-5);
    const center = paddle.y;
    const diff = target - center;
    let dir = 0;
    if(Math.abs(diff) > 6) dir = diff > 0 ? 1 : -1;
    if(paddle.reversed) dir *= -1;
    paddle.y += dir * paddle.speed * 0.85 * dt;
    const minY = paddle.lockZone ? paddle.lockZone.min : 0;
    const maxY = (paddle.lockZone ? paddle.lockZone.max : H) - paddle.h;
    paddle.y = Math.max(minY, Math.min(maxY, paddle.y));
  }

  function resetBallAfterScore(){
    balls = [freshBall(Math.random()<0.5?5.5:-5.5, (Math.random()*4-2))];
  }

  function spawnHitParticles(x,y,color){
    for(let i=0;i<8;i++){
      particles.push({x,y,vx:(Math.random()*4-2),vy:(Math.random()*4-2),life:20,color});
    }
  }

  function pointScored(who){
    running = false;
    const pts = (who==='p1' ? p1.doublePoints : p2.doublePoints) ? 2 : 1;
    if(who==='p1'){ score.p1 += pts; p1.doublePoints=false; }
    else { score.p2 += pts; p2.doublePoints=false; }
    updateScore();
    beep(who==='p1'?880:440, 0.25, 'triangle', 0.08);

    if(score.p1 >= WIN_SCORE || score.p2 >= WIN_SCORE){
      const winMsg = document.getElementById('winMsg');
      winMsg.textContent = (score.p1 > score.p2 ? 'PLAYER 1 ' : (mode==='ai'?'AI ':'PLAYER 2 ')) + 'WINS!';
      document.getElementById('winOverlay').classList.remove('hidden');
      return;
    }
    document.getElementById('pointMsg').textContent = (who==='p1'?'PLAYER 1':(mode==='ai'&&who==='p2'?'AI':'PLAYER 2')) + ' SCORES!';
    document.getElementById('pointOverlay').classList.remove('hidden');
  }

  function resumeAfterPoint(){
    resetBallAfterScore();
    running = true;
    requestAnimationFrame(loop);
  }

  // ---------- Main loop ----------
  let lastT = performance.now();
  function loop(now){
    if(!running) return;
    const dt = Math.min(2, (now - lastT) / 16.6);
    lastT = now;
    if(!paused){
      update(now, dt);
    }
    draw(now);
    requestAnimationFrame(loop);
  }

  function update(now, dt){
    // paddle control
    const p1up = keys['KeyW'], p1down = keys['KeyS'];
    movePaddle(p1, p1up, p1down, dt);

    if(mode === '2p'){
      movePaddle(p2, keys['ArrowUp'], keys['ArrowDown'], dt);
    } else {
      aiMove(p2, balls[0], dt);
    }

    clearExpiredEffects(p1);
    clearExpiredEffects(p2);

    // spawn power-ups
    if(now > nextPowerupAt && powerups.length < 3){
      spawnPowerup();
      nextPowerupAt = now + 5500 + Math.random()*4000;
    }

    // gravity well active?
    const gravityActive = now < gravityWellUntil;

    // update balls
    for(let bi = balls.length-1; bi>=0; bi--){
      const b = balls[bi];

      if(b.stuckTo){
        const paddle = b.stuckTo === 'p1' ? p1 : p2;
        b.x = paddle.isLeft ? paddle.x + paddle.w + b.r + 1 : paddle.x - b.r - 1;
        b.y = paddle.y + paddle.h/2;
        b.stuckTimer -= dt*16.6;
        if(b.stuckTimer <= 0){
          b.stuckTo = null;
          const ang = (Math.random()*0.6 - 0.3);
          const dir = paddle.isLeft ? 1 : -1;
          b.vx = dir * 5.5 * Math.cos(ang);
          b.vy = 5.5 * Math.sin(ang) + (Math.random()*2-1);
        }
        continue;
      }

      const speed = b.speedMul;
      let mx = b.vx * speed * dt;
      let my = b.vy * speed * dt;

      if(gravityActive){
        const wellY = H/2;
        my += (wellY - b.y) * 0.0018 * dt * 16.6 * 0.06;
      }
      if((b.owningCurve==='p1' && p1.curveCharge) || (b.owningCurve==='p2' && p2.curveCharge)){
        my += b.curveDir * 0.06 * dt * 16.6 * 0.06;
      }

      b.x += mx;
      b.y += my;

      // magnet pull
      [p1,p2].forEach(pd=>{
        if(pd.magnet){
          const midY = pd.y + pd.h/2;
          const near = pd.isLeft ? (b.x < W*0.4) : (b.x > W*0.6);
          if(near){
            b.y += (midY - b.y) * 0.01 * dt;
          }
        }
      });

      // wall collision
      if(b.y - b.r < 0){ b.y = b.r; b.vy *= -1; beep(300,0.05); }
      if(b.y + b.r > H){ b.y = H - b.r; b.vy *= -1; beep(300,0.05); }

      // paddle collision - p1 (left)
      if(b.vx < 0 && b.x - b.r < p1.x + p1.w && b.x - b.r > p1.x - 10 &&
         b.y > p1.y - b.r && b.y < p1.y + p1.h + b.r){
        if(b.ghost && b.lastHit === 'p2'){
          // ghost lets it pass through once (owner was p2, phases through p1... handled below for scoring)
        } else {
          handlePaddleHit(b, p1, 'p1');
        }
      }
      // paddle collision - p2 (right)
      if(b.vx > 0 && b.x + b.r > p2.x && b.x + b.r < p2.x + p2.w + 10 &&
         b.y > p2.y - b.r && b.y < p2.y + p2.h + b.r){
        if(b.ghost && b.lastHit === 'p1'){
          // phases through p2
        } else {
          handlePaddleHit(b, p2, 'p2');
        }
      }

      // scoring
      if(b.x + b.r < 0){
        if(p2.shield > 0 && b.lastHit !== 'p2'){
          p2.shield -= 1;
          b.x = p2.x + p2.w + 20; b.vx = Math.abs(b.vx);
          toast('P2 SHIELD BLOCKED IT!', '#4deeea');
        } else {
          balls.splice(bi,1);
          if(balls.length === 0) pointScored('p2');
          continue;
        }
      } else if(b.x - b.r > W){
        if(p1.shield > 0 && b.lastHit !== 'p1'){
          p1.shield -= 1;
          b.x = p1.x - 20; b.vx = -Math.abs(b.vx);
          toast('P1 SHIELD BLOCKED IT!', '#4deeea');
        } else {
          balls.splice(bi,1);
          if(balls.length === 0) pointScored('p1');
          continue;
        }
      }
    }

    // power-up collisions
    for(let pi = powerups.length-1; pi>=0; pi--){
      const pu = powerups[pi];
      for(const b of balls){
        const dx = b.x-pu.x, dy = b.y-pu.y;
        if(Math.sqrt(dx*dx+dy*dy) < pu.r + b.r){
          const ownerKey = b.lastHit || (b.vx < 0 ? 'p2' : 'p1');
          applyPowerup(pu.def, ownerKey);
          powerups.splice(pi,1);
          break;
        }
      }
    }

    // particles
    particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.life--; });
    particles = particles.filter(p=>p.life>0);
  }

  function handlePaddleHit(b, paddle, key){
    const rel = (b.y - (paddle.y + paddle.h/2)) / (paddle.h/2);
    const dir = paddle.isLeft ? 1 : -1;
    const speedMag = Math.min(11, Math.hypot(b.vx,b.vy) * 1.06 + 0.15);
    b.vx = dir * speedMag * Math.cos(rel*0.9);
    b.vy = speedMag * Math.sin(rel*0.9) * 1.4;
    b.lastHit = key;
    b.ghost = false;
    spawnHitParticles(b.x,b.y, paddle.isLeft?'#4deeea':'#ff2e88');
    beep(paddle.isLeft?520:480, 0.06);

    if(paddle.sticky){
      b.stuckTo = key;
      b.stuckTimer = 550;
      paddle.sticky = false;
    }
    if(paddle.curveCharge){
      b.owningCurve = key;
      b.curveDir = Math.random()<0.5?1:-1;
    }
    // nudge off paddle edge to avoid re-trigger
    b.x = paddle.isLeft ? paddle.x + paddle.w + b.r + 1 : paddle.x - b.r - 1;
  }

  // ---------- Drawing ----------
  function drawPaddle(p, color){
    ctx.save();
    ctx.shadowColor = color; ctx.shadowBlur = 14;
    ctx.fillStyle = color;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.restore();
    if(p.lockZone){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,46,136,0.4)';
      ctx.setLineDash([4,4]);
      ctx.strokeRect(p.isLeft?4:W-4-2, p.lockZone.min, 2, p.lockZone.max-p.lockZone.min);
      ctx.restore();
    }
    if(p.shield > 0){
      ctx.save();
      ctx.strokeStyle = '#4deeea';
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x-4, p.y-4, p.w+8, p.h+8);
      ctx.restore();
    }
  }

  function draw(now){
    ctx.clearRect(0,0,W,H);

    // center line
    ctx.save();
    ctx.strokeStyle = 'rgba(139,123,255,0.25)';
    ctx.setLineDash([6,10]);
    ctx.beginPath();
    ctx.moveTo(W/2,0); ctx.lineTo(W/2,H);
    ctx.stroke();
    ctx.restore();

    // gravity well visual
    if(now < gravityWellUntil){
      ctx.save();
      const g = ctx.createRadialGradient(W/2,H/2,4,W/2,H/2,90);
      g.addColorStop(0,'rgba(255,210,63,0.35)');
      g.addColorStop(1,'rgba(255,210,63,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(W/2,H/2,90,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    drawPaddle(p1, '#4deeea');
    drawPaddle(p2, '#ff2e88');

    // power-ups
    powerups.forEach(pu=>{
      const pulse = 1 + Math.sin(now/180 + pu.born)*0.08;
      ctx.save();
      ctx.shadowColor = pu.def.color; ctx.shadowBlur = 16;
      ctx.fillStyle = pu.def.color + '33';
      ctx.strokeStyle = pu.def.color;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(pu.x,pu.y,pu.r*pulse,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = pu.def.color;
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(pu.def.icon, pu.x, pu.y+1);
      ctx.restore();
    });

    // particles
    particles.forEach(p=>{
      ctx.save();
      ctx.globalAlpha = Math.max(0,p.life/20);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-1.5,p.y-1.5,3,3);
      ctx.restore();
    });

    // balls
    balls.forEach(b=>{
      if(b.invisible) return;
      ctx.save();
      const c = b.ghost ? '#ffd23f' : '#e6f2ff';
      ctx.shadowColor = c; ctx.shadowBlur = b.ghost ? 22 : 12;
      ctx.globalAlpha = b.ghost ? 0.55 : 1;
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
  }

  // initial idle draw
  draw(performance.now());
})();
</script>
