<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="/games/story/ruins-wandering-ghost/">
    <link rel="icon" href="data:,">
    <title>Ruins & the Wandering Ghost</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #05070d;
            font-family: -apple-system, system-ui, sans-serif;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        #hint {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(220, 225, 255, 0.5);
            font-size: 12px;
            letter-spacing: 0.03em;
            pointer-events: none;
            text-align: center;
            z-index: 5;
        }

        #questPanel {
            position: fixed;
            top: 18px;
            left: 18px;
            max-width: 320px;
            color: #dfe6ff;
            background: rgba(10, 12, 22, 0.55);
            backdrop-filter: blur(4px);
            border-left: 2px solid rgba(160, 180, 255, 0.6);
            padding: 12px 16px;
            border-radius: 4px;
            z-index: 5;
            transition: opacity 0.6s ease;
        }

        #questPanel .eyebrow {
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #8ea0e0;
            margin-bottom: 4px;
        }

        #questPanel h2 {
            margin: 0 0 6px;
            font-size: 15px;
            font-weight: 600;
            color: #eef2ff;
        }

        #questPanel p {
            margin: 0;
            font-size: 12.5px;
            line-height: 1.5;
            color: #c3cbea;
        }

        #toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            color: #eef2ff;
            font-size: 14px;
            letter-spacing: 0.02em;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            z-index: 6;
            text-shadow: 0 0 12px rgba(140, 170, 255, 0.8);
            transition: opacity 1s ease, transform 1s ease;
        }

        #toast.show {
            opacity: 1;
            transform: translate(-50%, -50%);
        }

        #joystick {
            position: fixed;
            bottom: 26px;
            left: 26px;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 1px solid rgba(200, 210, 255, 0.25);
            background: rgba(200, 210, 255, 0.05);
            z-index: 5;
            touch-action: none;
            display: none;
        }

        #joystickKnob {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(200, 215, 255, 0.35);
            left: 28px;
            top: 28px;
            box-shadow: 0 0 10px rgba(160, 190, 255, 0.5);
        }

        #interactPrompt {
            position: fixed;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-size: 15px;
            letter-spacing: 0.1em;
            text-shadow: 0 0 8px rgba(160, 190, 255, 0.8);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 5;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(200, 215, 255, 0.2);
        }

        #interactPrompt.show {
            opacity: 1;
        }

        .action-btn {
            position: fixed;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 1px solid rgba(200, 210, 255, 0.25);
            background: rgba(200, 210, 255, 0.1);
            color: rgba(200, 215, 255, 0.8);
            z-index: 5;
            touch-action: none;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(160, 190, 255, 0.2);
            backdrop-filter: blur(4px);
        }

        #btnInteract {
            bottom: 26px;
            right: 26px;
        }

        #btnMemorySense {
            bottom: 100px;
            right: 26px;
        }
    </style>
</head>
<body>
    <a href="/index.html" class="back-btn" style="position: fixed; top: 18px; right: 18px; z-index: 100; text-decoration: none; color: #dfe6ff; background: rgba(10, 12, 22, 0.7); backdrop-filter: blur(8px); border: 1px solid rgba(160, 180, 255, 0.4); padding: 8px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 1px; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;" onmouseover="this.style.background='rgba(30,35,60,0.9)'" onmouseout="this.style.background='rgba(10,12,22,0.7)'">← ARCADE</a>

    <div id="questPanel">
        <div class="eyebrow">Chapter One</div>
        <h2 id="questTitle">&nbsp;</h2>
        <p id="questText">&nbsp;</p>
    </div>
    <div id="toast"></div>
    <div id="hint">WASD / arrows to move &middot; drag to orbit camera &middot; scroll to zoom &middot; E to interact &middot; Q for Memory Sense</div>
    <div id="interactPrompt">[E] Inspect</div>
    
    <div id="joystick">
        <div id="joystickKnob"></div>
    </div>
    
    <div id="btnInteract" class="action-btn">E</div>
    <div id="btnMemorySense" class="action-btn">Q</div>

    <script type="module" src="/games/story/ruins-wandering-ghost/src/main.js"></script>
</body>

</html>
