<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zen Drive · A Peaceful Journey</title>
  <link rel="stylesheet" href="/games/story/zen-drive/style.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading">
    <h1>ZEN DRIVE</h1>
    <p>a peaceful journey through worlds</p>
    <div id="load-track"><div id="load-bar"></div></div>
  </div>

  <!-- Ambient visual effects -->
  <div id="vignette"></div>
  <div id="biome-fade"></div>
  
  <!-- UI Layer -->
  <div id="ui-layer">
    <div id="biome-label">Pine Forest</div>
    
    <div id="hud">
      <div class="pill" id="speed-pill">0 km/h</div>
      <div class="pill" id="biome-pill">Forest</div>
    </div>

    <button id="avatar-btn" class="top-btn" style="display:none;">👤 Soldier</button>
    <button id="mode-btn" class="top-btn">🚗 Drive Mode</button>
    <button id="cruise-btn" class="top-btn">✦ Auto Cruise</button>

    <!-- Mobile Touch Overlay Controls -->
    <div id="mobile-controls">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
      
      <div id="touch-actions">
        <button id="btn-touch-action" class="touch-btn">⚡ DRIFT / RUN</button>
      </div>
    </div>

    <div id="hints">
      W / ↑ &nbsp;Accelerate / Walk<br>
      S / ↓ &nbsp;Brake / Back<br>
      A / D &nbsp;Steer / Turn<br>
      SHIFT &nbsp;Run (On Foot)<br>
      V &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Switch Mode (Car / Walk)<br>
      X &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Switch Avatar (Soldier/Ratamahatta/Mannequin)<br>
      C &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Cruise Control<br>
      SPACE &nbsp;Drift
    </div>
  </div>

  <!-- Three.js & Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MD2Loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/misc/MD2Character.js"></script>
  
  <!-- Simplex Noise for terrain -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
  
  <!-- Source files -->
  <script src="/games/story/zen-drive/src/core/Input.js"></script>
  <script src="/games/story/zen-drive/src/core/Audio.js"></script>
  <script src="/games/story/zen-drive/src/core/Engine.js"></script>
  
  <script src="/games/story/zen-drive/src/entities/Car.js"></script>
  <script src="/games/story/zen-drive/src/entities/Character.js"></script>
  
  <script src="/games/story/zen-drive/src/world/BiomeManager.js"></script>
  <script src="/games/story/zen-drive/src/world/TerrainGenerator.js"></script>
  <script src="/games/story/zen-drive/src/world/RoadGenerator.js"></script>
  <script src="/games/story/zen-drive/src/world/World.js"></script>
  
  <script src="/games/story/zen-drive/src/ui/UIManager.js"></script>
  
  <script src="/games/story/zen-drive/src/main.js"></script>
</body>
</html>
